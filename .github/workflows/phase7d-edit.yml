name: Phase 7D verification
on:
  push:
    branches: [phase-7d-plugin-execution-hardening]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify timeout hardening is present
        run: |
          grep -q 'fn plugin_tool_timeout() -> Duration' rust/crates/plugins/src/lib.rs
          grep -q 'child.try_wait()' rust/crates/plugins/src/lib.rs
      - name: Run plugin crate tests
        working-directory: rust
        run: cargo test -p plugins
