name: Phase 10 cyberpunk web UI refinement

on:
  push:
    branches: [phase-10-ui-cyberpunk-final]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-10-ui-cyberpunk-final

      - name: Apply cyberpunk design system
        shell: python
        run: |
          from pathlib import Path

          path = Path('rust/crates/server/src/web.html')
          text = path.read_text(encoding='utf-8')
          start = text.find('<style>')
          end = text.find('</style>')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Could not locate embedded stylesheet')

          css = r'''
    :root {
      --background:#0a0a0f;
      --foreground:#e0e0e0;
      --card:#12121a;
      --muted:#1c1c2e;
      --muted-foreground:#6b7280;
      --accent:#00ff88;
      --accent-secondary:#ff00ff;
      --accent-tertiary:#00d4ff;
      --border:#2a2a3a;
      --input:#12121a;
      --ring:#00ff88;
      --destructive:#ff3366;
      --neon:0 0 5px #00ff88,0 0 10px #00ff8840;
      --neon-sm:0 0 3px #00ff88,0 0 6px #00ff8830;
      --neon-lg:0 0 10px #00ff88,0 0 20px #00ff8860,0 0 40px #00ff8830;
      --neon-magenta:0 0 5px #ff00ff,0 0 20px #ff00ff60;
      --neon-cyan:0 0 5px #00d4ff,0 0 20px #00d4ff60;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--background); }
    body {
      position:relative;
      margin:0;
      min-height:100vh;
      overflow:hidden;
      background:
        radial-gradient(circle at 88% 8%,#ff00ff14,transparent 22rem),
        radial-gradient(circle at 14% 72%,#00d4ff0d,transparent 24rem),
        linear-gradient(#00ff8808 1px,transparent 1px),
        linear-gradient(90deg,#00ff8808 1px,transparent 1px),
        var(--background);
      background-size:auto,auto,50px 50px,50px 50px,auto;
      color:var(--foreground);
      font:14px/1.5 "JetBrains Mono","Fira Code","Cascadia Code",Consolas,monospace;
    }
    body::after {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1000;
      opacity:.18;
      background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,#000 2px,#000 4px);
      mix-blend-mode:multiply;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:999;
      opacity:.25;
      background:linear-gradient(90deg,#ff00ff08,transparent 18%,transparent 82%,#00d4ff08);
    }
    button,select,textarea { font:inherit; }
    button { min-height:44px; }
    button:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--ring); outline-offset:2px; box-shadow:var(--neon); }
    .app { min-height:100vh; height:100vh; display:grid; grid-template-columns:250px minmax(0,1fr) 320px; background:transparent; }
    .rail,.side,main { min-height:0; }
    .rail {
      background:linear-gradient(180deg,#0f0f16f5,#0a0a0fe8);
      border-right:1px solid var(--border);
      padding:18px 14px;
      display:flex;
      flex-direction:column;
      gap:16px;
      overflow:hidden;
      box-shadow:inset -10px 0 24px #00ff8804;
    }
    .brand { color:var(--foreground); font:700 18px "Share Tech Mono",monospace; letter-spacing:.18em; text-transform:uppercase; padding:4px 8px 12px; text-shadow:0 0 8px #00ff8838,-2px 0 #ff00ff20,2px 0 #00d4ff20; }
    .mark { display:inline-grid; place-items:center; width:28px; height:28px; margin-right:8px; border:1px solid var(--accent); border-radius:0; background:var(--card); color:var(--accent); transform:skewX(-12deg); box-shadow:var(--neon-sm); }
    .new,.send { cursor:pointer; text-transform:uppercase; letter-spacing:.16em; transition:all 120ms steps(3); }
    .new { width:100%; background:transparent; color:var(--accent); border:1px solid var(--accent); clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px)); text-align:left; padding:10px 12px; font-size:11px; box-shadow:var(--neon-sm); }
    .new:hover { background:#00ff8816; color:#031109; box-shadow:var(--neon); }
    .label { padding:0 8px; color:var(--accent-tertiary); font-size:10px; text-transform:uppercase; letter-spacing:.2em; }
    .sessions { display:grid; gap:5px; flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#00ff8844 transparent; }
    .session { width:100%; border:1px solid transparent; border-radius:0; background:transparent; text-align:left; padding:10px; cursor:pointer; color:var(--muted-foreground); min-height:44px; transition:all 120ms steps(3); }
    .session:hover { color:var(--accent); border-color:#00ff8848; background:#00ff8808; }
    .session.active { color:var(--accent); border-color:var(--accent); background:#00ff8810; box-shadow:var(--neon-sm); clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%); }
    .session strong,.session span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session strong { font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .session span { margin-top:4px; color:#59616f; font-size:9px; }
    .footer { margin-top:auto; border-top:1px solid var(--border); padding:12px 8px 0; color:#59616f; font-size:9px; line-height:1.7; letter-spacing:.12em; }
    main { display:flex; min-width:0; max-height:100vh; flex-direction:column; background:linear-gradient(180deg,#0a0a0fe6,#0a0a0ff5); }
    .top { height:68px; flex:0 0 auto; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 28px; background:#0b0b11e8; }
    .top > span:first-child { color:#7e8796; font-size:10px; text-transform:uppercase; letter-spacing:.16em; }
    .top b { color:var(--accent); font-size:11px; text-shadow:0 0 8px #00ff8848; }
    .online { color:#747c8c; font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
    .online:before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; background:var(--accent); box-shadow:var(--neon-sm); }
    .chat { flex:1 1 auto; min-height:0; overflow:auto; padding:38px clamp(20px,6vw,96px) 24px; scrollbar-width:thin; scrollbar-color:#00ff8844 transparent; }
    .hero { max-width:780px; margin:8vh auto 44px; }
    .eyebrow { color:var(--accent-tertiary); font-size:10px; text-transform:uppercase; letter-spacing:.22em; }
    h1 { position:relative; margin:16px 0; color:var(--foreground); font:900 clamp(42px,6vw,76px)/.92 "Orbitron","Share Tech Mono",monospace; text-transform:uppercase; letter-spacing:.08em; text-shadow:0 0 14px #00ff8840,-2px 0 #ff00ff80,2px 0 #00d4ff80; animation:glitch 5s steps(1,end) infinite,rgbShift 2.8s steps(2,end) infinite; }
    h1::after { content:"_"; color:var(--accent); animation:blink 1s step-end infinite; text-shadow:0 0 10px #00ff88; }
    p { max-width:650px; color:#87909e; font-size:14px; line-height:1.8; letter-spacing:.02em; }
    .messages { max-width:860px; margin:auto; display:grid; gap:16px; }
    .message { max-width:94%; white-space:pre-wrap; padding:14px 16px; border:1px solid var(--border); border-radius:0; background:var(--card); color:var(--foreground); font-size:13px; line-height:1.7; clip-path:polygon(0 9px,9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%); box-shadow:0 8px 30px #0008; }
    .message.user { justify-self:end; background:#071b13; border-color:#00ff8850; box-shadow:var(--neon-sm); clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); }
    .message.error { background:#1a0c12; border-color:var(--destructive); color:#ffb0c3; box-shadow:0 0 8px #ff336644; }
    .pending { color:#8c95a4; font-style:normal; }
    .trace { max-width:94%; border:1px solid var(--border); border-radius:0; overflow:hidden; background:#0d0d14; box-shadow:inset 0 0 20px #00d4ff05; clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); }
    .trace summary { cursor:pointer; padding:10px 13px; color:var(--accent-tertiary); font-size:10px; text-transform:uppercase; letter-spacing:.13em; }
    .trace summary:hover { text-shadow:var(--neon-cyan); }
    .trace summary::marker { color:var(--accent); }
    .trace-list { padding:0 12px 12px; display:grid; gap:7px; }
    .tool { border-left:2px solid var(--accent); background:#101018; padding:8px 10px; border-radius:0; }
    .tool.error { border-color:var(--destructive); }
    .tool b { display:block; color:var(--accent); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    .tool code { display:block; margin-top:4px; white-space:pre-wrap; word-break:break-word; color:#737d8d; font-size:10px; line-height:1.45; }
    .empty-work { padding:0 13px 12px; color:#59616f; font-size:10px; }
    .compose-wrap { flex:0 0 auto; padding:8px clamp(20px,6vw,96px) 24px; background:linear-gradient(180deg,transparent,#0a0a0ff5 24%); }
    form { position:relative; max-width:860px; margin:auto; padding:10px; background:var(--input); border:1px solid var(--border); clip-path:polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); box-shadow:0 0 0 1px #00ff8808,0 12px 40px #000b; }
    form::before { content:">"; position:absolute; left:16px; top:12px; color:var(--accent); font-weight:700; text-shadow:var(--neon-sm); }
    textarea { width:100%; min-height:60px; padding:8px 10px 8px 26px; border:0; resize:none; outline:0; background:transparent; color:var(--foreground); font-size:13px; line-height:1.6; }
    textarea::placeholder { color:#565e6d; }
    textarea:focus { box-shadow:none; }
    .compose-bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .model { max-width:78%; background:#0d0d14; color:var(--accent); border:1px solid var(--border); border-radius:0; padding:9px 10px; font-size:10px; }
    .model:hover { border-color:#00ff8866; }
    .send { padding:9px 14px; background:var(--accent); color:#031109; border:1px solid var(--accent); font-weight:800; font-size:11px; clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px)); box-shadow:var(--neon); }
    .send:hover { filter:brightness(1.1); box-shadow:var(--neon-lg); }
    .send:disabled { opacity:.55; cursor:not-allowed; }
    .side { height:100vh; background:#0c0c13ee; border-left:1px solid var(--border); padding:20px 16px; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#00ff8844 transparent; }
    .side h2 { margin:0 0 18px; color:var(--accent-secondary); font:700 12px "Share Tech Mono",monospace; text-transform:uppercase; letter-spacing:.2em; text-shadow:var(--neon-magenta); }
    .card { position:relative; background:var(--card); border:1px solid var(--border); border-radius:0; padding:13px; margin-bottom:12px; clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); box-shadow:inset 0 0 22px #00ff8804; }
    .card:hover { border-color:#00ff8848; }
    .card h3 { margin:0 0 10px; color:#8e98a8; font-size:9px; letter-spacing:.17em; text-transform:uppercase; }
    .metric { display:flex; justify-content:space-between; gap:12px; border-top:1px solid #202030; padding:8px 0; color:#737d8d; font-size:10px; }
    .metric:first-of-type { border:0; padding-top:0; }
    .metric b { color:var(--accent); font-size:10px; text-align:right; word-break:break-word; }
    .activity { position:relative; padding:0 0 12px 15px; color:#c5cad4; font-size:10px; }
    .activity:before { content:""; position:absolute; left:0; top:4px; width:6px; height:6px; border:1px solid var(--accent-tertiary); background:#00d4ff22; box-shadow:var(--neon-cyan); }
    .activity.error:before { border-color:var(--destructive); box-shadow:0 0 6px #ff3366; }
    .activity span { display:block; margin-top:3px; color:#5e6776; font-size:9px; }
    .agent { position:relative; padding:0 0 10px 15px; color:#c5cad4; font-size:10px; }
    .agent:before { content:""; position:absolute; left:0; top:4px; width:7px; height:7px; background:#444b57; }
    .agent.running:before { background:var(--accent-tertiary); box-shadow:var(--neon-cyan); animation:blink 1s step-end infinite; }
    .agent.completed:before { background:var(--accent); box-shadow:var(--neon-sm); }
    .agent.failed:before { background:var(--destructive); box-shadow:0 0 6px #ff3366; }
    .agent strong,.agent span { display:block; }
    .agent strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .agent span { margin-top:3px; color:#626b79; font-size:9px; }
    .agent-group-label { margin:2px 0 9px; color:var(--accent-tertiary); font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
    .agent-group-empty { padding:4px 0 10px; color:#59616f; font-size:9px; }
    .agent-history { margin-top:6px; border-top:1px solid #232332; padding-top:8px; }
    .agent-history summary { cursor:pointer; color:#7c8695; font-size:9px; text-transform:uppercase; letter-spacing:.1em; }
    .agent-history summary:hover { color:var(--accent); text-shadow:var(--neon-sm); }
    .agent-history-list { margin-top:10px; }
    ::selection { background:#00ff8830; color:var(--foreground); }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:#0a0a0f; }
    ::-webkit-scrollbar-thumb { background:#263443; border:1px solid #00ff8830; }
    ::-webkit-scrollbar-thumb:hover { background:#314255; }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes glitch { 0%,88%,100% { transform:translate(0,0); } 89% { transform:translate(-2px,1px) skewX(-3deg); } 91% { transform:translate(2px,-1px) skewX(2deg); } 93% { transform:translate(-1px,0); } }
    @keyframes rgbShift { 0%,100% { text-shadow:-2px 0 #ff00ff,2px 0 #00d4ff,0 0 14px #00ff8840; } 50% { text-shadow:2px 0 #ff00ff,-2px 0 #00d4ff,0 0 14px #00ff8840; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } h1::after { opacity:1; } }
    @media(max-width:960px) { .app { grid-template-columns:220px minmax(0,1fr); }.side { display:none; } }
    @media(max-width:640px) { body { overflow:auto; }.app { display:block; height:auto; min-height:100vh; }.rail { display:none; } .top { height:60px; padding:12px 16px; }.top > span:first-child { font-size:9px; }.online { font-size:8px; }.chat { min-height:0; padding:26px 14px 18px; }.hero { margin:3vh auto 28px; }.hero p { font-size:12px; }.message,.trace { max-width:100%; }.message { font-size:12px; }.compose-wrap { padding:8px 12px 16px; }.model { max-width:70%; font-size:9px; }.send { min-height:44px; }.side { display:none; } }
'''
          text = text[:start + len('<style>')] + '\n' + css + text[end:]

          old_h1 = '<h1>What are we building?</h1>'
          new_h1 = '<h1 class="cyber-glitch">What are we building?</h1>'
          if old_h1 not in text:
              raise SystemExit('Expected hero heading not found')
          text = text.replace(old_h1, new_h1, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/phase10-ui-cyberpunk-final.yml')
          workflow.unlink()

      - name: Commit final UI and remove bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/server/src/web.html .github/workflows/phase10-ui-cyberpunk-final.yml
          git diff --cached --quiet && exit 1
          git commit -m "style: finalize cyberpunk web UI [skip ci]"
          git push origin HEAD:phase-10-ui-cyberpunk-final
