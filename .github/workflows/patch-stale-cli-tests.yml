name: Stage stale CLI test fixes

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'phase-9c-mcp-inspector' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Patch stale expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/claw-cli/src/main.rs')
          text = path.read_text()

          old_alias = '"deepseek-ai/deepseek-v4-flash-0731"'
          new_alias = '"deepseek-ai/deepseek-v4-flash"'
          if old_alias not in text:
              raise SystemExit('expected stale NVIDIA alias expectation not found')
          text = text.replace(old_alias, new_alias, 1)

          old_list = '''                "help", "status", "compact", "clear", "cost", "config", "memory", "init", "diff",\n                "version", "export", "agents", "skills",'''
          new_list = '''                "help", "status", "hooks", "compact", "clear", "cost", "config", "memory", "init", "diff",\n                "version", "export", "agents", "skills",'''
          if old_list not in text:
              raise SystemExit('expected stale resume-supported command list not found')
          text = text.replace(old_list, new_list, 1)

          path.write_text(text)
          PY

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-stale-cli-tests.yml
          git add rust/crates/claw-cli/src/main.rs
          git commit -m 'test: refresh stale CLI expectations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
