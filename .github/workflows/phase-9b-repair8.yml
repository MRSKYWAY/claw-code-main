name: phase-9b-repair8
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair source deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # commands source
          p = Path('rust/crates/commands/src/lib.rs')
          lines = p.read_text().splitlines()

          # Remove stale duplicate parser arm.
          out = []
          i = 0
          in_parse = False
          while i < len(lines):
              line = lines[i]
              if line.strip() == 'pub fn parse(input: &str) -> Option<Self> {':
                  in_parse = True
              if in_parse and line.strip() == '"hooks" => Self::Config {':
                  if i + 2 < len(lines) and lines[i+1].strip().startswith('section: Some("hooks"') and lines[i+2].strip() == '},':
                      i += 3
                      continue
              out.append(line)
              if in_parse and line.strip() == '}' and i > 0 and lines[i-1].strip().startswith('other =>'):
                  in_parse = False
              i += 1
          lines = out

          # Replace the hook mutation borrow sequence.
          start = next((i for i, line in enumerate(lines) if 'let hooks = root.get_mut("hooks").and_then(serde_json::Value::as_object_mut);' in line), None)
          if start is not None:
              end = next((i for i in range(start, min(start + 12, len(lines))) if 'expect("hooks object")' in lines[i]), None)
              if end is None:
                  raise SystemExit('hooks borrow block terminator not found')
              lines[start:end+1] = [
                  '            if let Some(value) = root.get("hooks") {',
                  '                if !value.is_object() {',
                  '                    return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));',
                  '                }',
                  '            } else {',
                  '                root["hooks"] = serde_json::json!({});',
                  '            }',
                  '            let hooks = root',
                  '                .get_mut("hooks")',
                  '                .and_then(serde_json::Value::as_object_mut)',
                  '                .expect("hooks object");',
              ]

          text = '\n'.join(lines) + '\n'

          # Add Hooks to the generic dispatcher fallback.
          marker = '        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'
          if marker in text and '| SlashCommand::Hooks { .. }' not in text[text.find('pub fn handle_slash_command('):]:
              text = text.replace(marker, '        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,', 1)

          # Update the /hooks parser regression assertion, regardless of compact/multiline formatting.
          needle = '            SlashCommand::parse("/hooks"),'
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit('hooks parser assertion not found')
          end = text.find('        );', pos)
          if end < 0:
              raise SystemExit('hooks parser assertion end not found')
          block = text[pos:end+len('        );')]
          if 'SlashCommand::Config' in block:
              replacement = '''            SlashCommand::parse("/hooks"),\n            Some(SlashCommand::Hooks {\n                action: None,\n                event: None,\n                command: None,\n            })\n        );'''
              text = text[:pos] + replacement + text[end+len('        );'):]

          p.write_text(text)

          # claw-cli resume dispatcher.
          p = Path('rust/crates/claw-cli/src/main.rs')
          lines = p.read_text().splitlines()
          start = next((i for i, line in enumerate(lines) if line.strip() == 'fn run_resume_command('), None)
          if start is None:
              raise SystemExit('run_resume_command not found')
          depth = 0
          target = None
          for i in range(start, len(lines)):
              depth += lines[i].count('{') - lines[i].count('}')
              if 'SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),' in lines[i] and depth > 0:
                  target = i
                  break
          if target is None:
              raise SystemExit('resume Unknown arm not found')
          if not any('SlashCommand::Hooks { .. }' in line for line in lines[start:target+1]):
              lines.insert(target, '        | SlashCommand::Hooks { .. }')
          p.write_text('\n'.join(lines) + '\n')
          PY

          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Commit validated repair and clean scaffolding
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml .github/workflows/phase-9b-lastfix.yml .github/workflows/phase-9b-repair-final.yml .github/workflows/phase-9b-final-testfix.yml .github/workflows/phase-9b-repair8.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt .github/phase-9b-final-trigger.txt .github/phase-9b-repair-final-trigger.txt .github/phase-9b-deterministic-trigger.txt .github/phase-9b-final-test-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hooks"
          git push
