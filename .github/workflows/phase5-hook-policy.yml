name: Phase 5 Hook Policy

on:
  push:
    branches:
      - phase-5-hook-policy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hook policy API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/runtime/src/hooks.rs')
          text = path.read_text()
          text = text.replace(
              '#[derive(Debug, Clone, PartialEq, Eq)]\npub struct HookRunResult {\n    denied: bool,\n    messages: Vec<String>,\n}',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum HookDecision {\n    Allow,\n    Deny,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct HookRunResult {\n    denied: bool,\n    messages: Vec<String>,\n}'
          )
          text = text.replace(
              '    #[must_use]\n    pub fn is_denied(&self) -> bool {\n        self.denied\n    }',
              '    #[must_use]\n    pub fn decision(&self) -> HookDecision {\n        if self.denied {\n            HookDecision::Deny\n        } else {\n            HookDecision::Allow\n        }\n    }\n\n    #[must_use]\n    pub fn is_denied(&self) -> bool {\n        matches!(self.decision(), HookDecision::Deny)\n    }'
          )
          text = text.replace(
              '    use super::{hook_timeout, HookRunResult, HookRunner, MAX_HOOK_TIMEOUT_MS, MIN_HOOK_TIMEOUT_MS};',
              '    use super::{hook_timeout, HookDecision, HookRunResult, HookRunner, MAX_HOOK_TIMEOUT_MS, MIN_HOOK_TIMEOUT_MS};'
          )
          text = text.replace(
              '        assert_eq!(result, HookRunResult::allow(vec!["pre ok".to_string()]));',
              '        assert_eq!(result, HookRunResult::allow(vec!["pre ok".to_string()]));\n        assert_eq!(result.decision(), HookDecision::Allow);'
          )
          text = text.replace(
              '        assert!(result.is_denied());\n        assert_eq!(result.messages(), &["blocked by hook".to_string()]);',
              '        assert!(result.is_denied());\n        assert_eq!(result.decision(), HookDecision::Deny);\n        assert_eq!(result.messages(), &["blocked by hook".to_string()]);'
          )
          path.write_text(text)
          PY
      - name: Verify runtime
        run: cargo test --manifest-path rust/Cargo.toml -p runtime hooks --lib
      - name: Verify CLI build
        run: cargo check --manifest-path rust/Cargo.toml -p claw-cli
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/runtime/src/hooks.rs
          git diff --cached --quiet || git commit -m "feat: expose structured hook policy decisions"
          git push
          rm .github/workflows/phase5-hook-policy.yml .phase5-trigger
          git add .github/workflows/phase5-hook-policy.yml .phase5-trigger
          git commit -m "chore: remove temporary phase 5 verification files"
          git push
