name: Phase 10C Clippy Fix

on:
  push:
    branches:
      - phase-10c-clippy-fix-temp

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix unnested or-patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "rust/crates/runtime/src/subagent.rs": (
                  "            (Queued, Running)\n                | (Queued, Failed)\n                | (Queued, Cancelled)\n                | (Running, Succeeded)\n                | (Running, Failed)\n                | (Running, Cancelled)",
                  "            (Queued, Running | Failed | Cancelled)\n                | (Running, Succeeded | Failed | Cancelled)",
              ),
              "rust/crates/tools/src/agent_lifecycle.rs": (
                  "            (Queued, Running)\n                | (Queued, Failed)\n                | (Queued, Cancelled)\n                | (Running, Succeeded)\n                | (Running, Failed)\n                | (Running, Cancelled)",
                  "            (Queued, Running | Failed | Cancelled)\n                | (Running, Succeeded | Failed | Cancelled)",
              ),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected match count in {name}: {text.count(old)}")
              p.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/runtime/src/subagent.rs rust/crates/tools/src/agent_lifecycle.rs
          git rm .github/workflows/phase-10c-clippy-fix.yml
          git commit -m 'clippy: nest subagent lifecycle or-patterns'
          git push
