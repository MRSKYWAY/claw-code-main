name: Phase 10D final repair

on:
  push:
    branches:
      - phase-10d-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 10D branch
        uses: actions/checkout@v4
        with:
          ref: phase-10d-clean
          fetch-depth: 0

      - name: Apply final Phase 10D fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          old = '"version", "export", "agents", "skills",\n            ]'
          new = '"version", "export", "agents", "skills", "tasks",\n            ]'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          s = s.replace('assert_eq!(slash_command_specs().len(), 30);', 'assert_eq!(slash_command_specs().len(), 31);', 1)
          s = s.replace('assert_eq!(resume_supported_slash_commands().len(), 15);', 'assert_eq!(resume_supported_slash_commands().len(), 16);', 1)

          start = s.index('fn render_task_row(')
          end = s.index('\nfn render_task_snapshot(', start)
          new_fn = '''fn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {
    let parent = snapshot.parent_id.as_deref().unwrap_or("-");
    let result = snapshot
        .result
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Result           {value}"));
    let error = snapshot
        .error
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Error            {value}"));
    format!(
        "  {:<24} {:<11} parent={parent}\\n    {}{result}{error}",
        snapshot.id,
        format_task_state(snapshot.state),
        snapshot.description,
    )
}'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          PY

          for f in \
            .github/workflows/p10d-finalize.yml \
            .github/workflows/phase-10d-fix.yml \
            .github/workflows/phase-10d-fix2.yml \
            .github/workflows/phase-10d-one-shot.yml \
            .github/workflows/phase-10d-pr-repair.yml \
            .github/workflows/phase-10d-main-repair.yml; do
            git rm -f "$f" 2>/dev/null || true
          done

      - name: Verify CLI regression
        working-directory: rust
        run: cargo test -p claw-cli --bin claw resume_supported_command_list_matches_expected_surface

      - name: Verify tasks regression
        working-directory: rust
        run: cargo test -p commands --lib tasks_command_parses_and_renders_registry_state

      - name: Verify full workspace tests
        working-directory: rust
        run: cargo test --workspace --exclude tools

      - name: Commit clean Phase 10D tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/p10d-final-repair.yml
          git add rust/crates/claw-cli/src/main.rs rust/crates/commands/src/lib.rs .github/workflows/ci.yml .github/workflows
          git commit -m "fix: finish Phase 10D test surface"
          git push origin HEAD:phase-10d-clean

# Triggered by a connector-authored commit so the repair job runs on the branch.
