name: Temporary plugin stdin fix

on:
  pull_request:
    types: [edited]
    paths:
      - .github/workflows/temp-plugin-stdin-fix.yml
      - rust/crates/plugins/src/lib.rs

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-9c-mcp-inspector
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Patch plugin stdin handling and run targeted test
        working-directory: rust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/plugins/src/lib.rs')
          text = p.read_text()
          old = '''        let mut child = process.spawn()?;\n        if let Some(stdin) = child.stdin.as_mut() {\n            use std::io::Write as _;\n            stdin.write_all(input_json.as_bytes())?;\n        }\n'''
          new = '''        let mut child = process.spawn()?;\n        if let Some(mut stdin) = child.stdin.take() {\n            use std::io::Write as _;\n            stdin.write_all(input_json.as_bytes())?;\n        }\n'''
          if old not in text:
              raise SystemExit('expected plugin stdin block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo test -p plugins --lib tests::aggregates_and_executes_plugin_tools
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/plugins/src/lib.rs
          git commit -m 'fix: close plugin tool stdin after request'
          cd ..
          rm .github/workflows/temp-plugin-stdin-fix.yml
          git add .github/workflows/temp-plugin-stdin-fix.yml
          git commit -m 'chore: remove temporary plugin fix runner'
          git push origin HEAD:phase-9c-mcp-inspector
