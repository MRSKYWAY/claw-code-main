name: Phase 10D implementation

on:
  push:
    branches: [phase-10d-task-inspection]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact task inspection changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          commands = Path('rust/crates/commands/src/lib.rs')
          text = commands.read_text()

          old = '''    SlashCommandSpec {\n        name: "skills",\n        aliases: &[],\n        summary: "List available skills",\n        argument_hint: None,\n        resume_supported: true,\n        category: SlashCommandCategory::Automation,\n    },\n];'''
          new = '''    SlashCommandSpec {\n        name: "skills",\n        aliases: &[],\n        summary: "List available skills",\n        argument_hint: None,\n        resume_supported: true,\n        category: SlashCommandCategory::Automation,\n    },\n    SlashCommandSpec {\n        name: "tasks",\n        aliases: &[],\n        summary: "Inspect running and completed Agent tasks",\n        argument_hint: Some("[agent-id]"),\n        resume_supported: true,\n        category: SlashCommandCategory::Automation,\n    },\n];'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    Skills {\n        args: Option<String>,\n    },\n    Unknown(String),'''
          new = '''    Skills {\n        args: Option<String>,\n    },\n    Tasks {\n        agent_id: Option<String>,\n    },\n    Unknown(String),'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''            "skills" => Self::Skills {\n                args: remainder_after_command(trimmed, command),\n            },\n            other => Self::Unknown(other.to_string()),'''
          new = '''            "skills" => Self::Skills {\n                args: remainder_after_command(trimmed, command),\n            },\n            "tasks" => Self::Tasks {\n                agent_id: parts.next().map(ToOwned::to_owned),\n            },\n            other => Self::Unknown(other.to_string()),'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = '''pub fn handle_skills_slash_command(args: Option<&str>, cwd: &Path) -> std::io::Result<String> {'''
          insert = '''#[must_use]\npub fn render_tasks_report(\n    snapshots: &[runtime::SubagentSnapshot],\n    agent_id: Option<&str>,\n) -> String {\n    if let Some(agent_id) = agent_id {\n        let Some(snapshot) = snapshots.iter().find(|snapshot| snapshot.id == agent_id) else {\n            return format!("Tasks\\n  Agent            {agent_id}\\n  Result           not found");\n        };\n        return render_task_snapshot(snapshot);\n    }\n\n    let mut lines = vec![\n        "Tasks".to_string(),\n        format!("  Total            {}", snapshots.len()),\n    ];\n    if snapshots.is_empty() {\n        lines.push("  No registered Agent tasks.".to_string());\n        return lines.join("\\n");\n    }\n    lines.push(String::new());\n    lines.push("Registered tasks".to_string());\n    lines.extend(snapshots.iter().map(render_task_row));\n    lines.join("\\n")\n}\n\nfn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {\n    let parent = snapshot.parent_id.as_deref().unwrap_or("-");\n    format!(\n        "  {:<24} {:<11} parent={parent}\\n    {}",\n        snapshot.id,\n        format_task_state(snapshot.state),\n        snapshot.description,\n    )\n}\n\nfn render_task_snapshot(snapshot: &runtime::SubagentSnapshot) -> String {\n    let mut lines = vec![\n        "Task".to_string(),\n        format!("  Agent            {}", snapshot.id),\n        format!("  State            {}", format_task_state(snapshot.state)),\n        format!(\n            "  Parent           {}",\n            snapshot.parent_id.as_deref().unwrap_or("-")\n        ),\n        format!("  Description      {}", snapshot.description),\n    ];\n    if let Some(result) = snapshot.result.as_deref() {\n        lines.push(format!("  Result           {result}"));\n    }\n    if let Some(error) = snapshot.error.as_deref() {\n        lines.push(format!("  Error            {error}"));\n    }\n    lines.join("\\n")\n}\n\nfn format_task_state(state: runtime::SubagentState) -> &'static str {\n    match state {\n        runtime::SubagentState::Queued => "queued",\n        runtime::SubagentState::Running => "running",\n        runtime::SubagentState::Succeeded => "succeeded",\n        runtime::SubagentState::Failed => "failed",\n        runtime::SubagentState::Cancelled => "cancelled",\n    }\n}\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insert + marker)
          commands.write_text(text)

          cli = Path('rust/crates/claw-cli/src/main.rs')
          text = cli.read_text()

          old = '''    handle_agents_slash_command, handle_hooks_slash_command, handle_plugins_slash_command,\n    handle_skills_slash_command, render_mcp_report, render_slash_command_help,'''
          new = '''    handle_agents_slash_command, handle_hooks_slash_command, handle_plugins_slash_command,\n    handle_skills_slash_command, render_mcp_report, render_slash_command_help, render_tasks_report,'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''            SlashCommand::Skills { args } => {\n                Self::print_skills(args.as_deref())?;\n                false\n            }\n            SlashCommand::Branch { .. } => {'''
          new = '''            SlashCommand::Skills { args } => {\n                Self::print_skills(args.as_deref())?;\n                false\n            }\n            SlashCommand::Tasks { agent_id } => {\n                Self::print_tasks(agent_id.as_deref())?;\n                false\n            }\n            SlashCommand::Branch { .. } => {'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    fn print_skills(args: Option<&str>) -> Result<(), Box<dyn std::error::Error>> {\n        let cwd = env::current_dir()?;\n        println!("{}", handle_skills_slash_command(args, &cwd)?);\n        Ok(())\n    }'''
          new = '''    fn print_skills(args: Option<&str>) -> Result<(), Box<dyn std::error::Error>> {\n        let cwd = env::current_dir()?;\n        println!("{}", handle_skills_slash_command(args, &cwd)?);\n        Ok(())\n    }\n\n    fn print_tasks(agent_id: Option<&str>) -> Result<(), Box<dyn std::error::Error>> {\n        let snapshots = runtime::global_subagent_registry().snapshots()?;\n        println!("{}", render_tasks_report(&snapshots, agent_id));\n        Ok(())\n    }'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''        SlashCommand::Skills { args } => {\n            let cwd = env::current_dir()?;\n            Ok(ResumeCommandOutcome {\n                session: session.clone(),\n                message: Some(handle_skills_slash_command(args.as_deref(), &cwd)?),\n            })\n        }\n        SlashCommand::Bughunter { .. }'''
          new = '''        SlashCommand::Skills { args } => {\n            let cwd = env::current_dir()?;\n            Ok(ResumeCommandOutcome {\n                session: session.clone(),\n                message: Some(handle_skills_slash_command(args.as_deref(), &cwd)?),\n            })\n        }\n        SlashCommand::Tasks { agent_id } => {\n            let snapshots = runtime::global_subagent_registry().snapshots()?;\n            Ok(ResumeCommandOutcome {\n                session: session.clone(),\n                message: Some(render_tasks_report(&snapshots, agent_id.as_deref())),\n            })\n        }\n        SlashCommand::Bughunter { .. }'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          cli.write_text(text)
          PY
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/commands/src/lib.rs rust/crates/claw-cli/src/main.rs
          git commit -m "feat: add registry-backed task inspection"
          git rm .github/workflows/phase-10d-implementation.yml
          git commit -m "chore: remove temporary phase 10D workflow"
          git push
