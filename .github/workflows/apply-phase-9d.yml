name: Apply Phase 9D MCP command

on:
  push:
    branches:
      - phase-9d-mcp-slash-command

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-9d-mcp-slash-command
      - name: Apply patch helper
        run: python3 phase-9d-patch.py
      - name: Complete shared dispatcher match
        working-directory: rust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/commands/src/lib.rs")
          text = p.read_text()
          old = "        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,"
          new = "        | SlashCommand::Skills { .. }\n        | SlashCommand::Mcp\n        | SlashCommand::Unknown(_) => None,"
          if old not in text:
              raise SystemExit("dispatcher match anchor not found")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate patch
        working-directory: rust
        run: |
          cargo check --workspace
          cargo test -p commands --lib
          cargo test -p claw-cli --bin claw
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f phase-9d-patch.py
          git add PARITY.md rust/crates/commands/src/lib.rs rust/crates/commands/src/bin/mcp.rs rust/crates/claw-cli/src/main.rs phase-9d-patch.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Phase 9D: wire interactive MCP slash command"
          git push
