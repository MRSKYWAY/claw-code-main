name: phase-9b-repair7
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Complete Phase 9B fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          commands = Path('rust/crates/commands/src/lib.rs')
          text = commands.read_text()
          stale_parser = '''            "hooks" => Self::Config {\n                section: Some("hooks".to_string()),\n            },\n'''
          if stale_parser not in text:
              raise SystemExit('stale duplicate hooks parser arm not found')
          text = text.replace(stale_parser, '', 1)
          commands.write_text(text)

          cli = Path('rust/crates/claw-cli/src/main.rs')
          text = cli.read_text()
          marker = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,\n'''
          marker_with_hooks = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,\n'''
          if marker in text:
              raise SystemExit('wrong dispatcher marker found in claw-cli')
          target = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),\n'''
          replacement = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),\n'''
          if target not in text:
              raise SystemExit('resume dispatcher match arm not found in claw-cli')
          text = text.replace(target, replacement, 1)
          cli.write_text(text)
          PY

          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Clean temporary repair workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete phase 9b hook management"
          git push
