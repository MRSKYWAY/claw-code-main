name: Phase 10D finalize

on:
  push:
    branches: [phase-10d-task-inspection]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply task inspection changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          a = s.index('const SLASH_COMMAND_SPECS:')
          b = s.index('\n];', a)
          if 'name: "tasks"' not in s[a:b]:
              s = s[:b] + '''\n    SlashCommandSpec {\n        name: "tasks",\n        aliases: &[],\n        summary: "Inspect running and completed Agent tasks",\n        argument_hint: Some("[agent-id]"),\n        resume_supported: true,\n        category: SlashCommandCategory::Automation,\n    },''' + s[b:]
          if '    Tasks {\n        agent_id: Option<String>,' not in s:
              s = s.replace('''    Skills {\n        args: Option<String>,\n    },\n    Unknown(String),''', '''    Skills {\n        args: Option<String>,\n    },\n    Tasks {\n        agent_id: Option<String>,\n    },\n    Unknown(String),''')
          if '"tasks" => Self::Tasks' not in s:
              s = s.replace('''            "skills" => Self::Skills {\n                args: remainder_after_command(trimmed, command),\n            },\n            other => Self::Unknown(other.to_string()),''', '''            "skills" => Self::Skills {\n                args: remainder_after_command(trimmed, command),\n            },\n            "tasks" => Self::Tasks {\n                agent_id: parts.next().map(ToOwned::to_owned),\n            },\n            other => Self::Unknown(other.to_string()),''')
          if 'pub fn render_tasks_report(' not in s:
              marker = 'pub fn handle_skills_slash_command(args: Option<&str>, cwd: &Path) -> std::io::Result<String> {'
              insert = '''#[must_use]\npub fn render_tasks_report(\n    snapshots: &[runtime::SubagentSnapshot],\n    agent_id: Option<&str>,\n) -> String {\n    if let Some(agent_id) = agent_id {\n        let Some(snapshot) = snapshots.iter().find(|snapshot| snapshot.id == agent_id) else {\n            return format!("Tasks\\n  Agent            {agent_id}\\n  Result           not found");\n        };\n        return render_task_snapshot(snapshot);\n    }\n    let mut lines = vec!["Tasks".to_string(), format!("  Total            {}", snapshots.len())];\n    if snapshots.is_empty() {\n        lines.push("  No registered Agent tasks.".to_string());\n        return lines.join("\\n");\n    }\n    lines.push(String::new());\n    lines.push("Registered tasks".to_string());\n    lines.extend(snapshots.iter().map(render_task_row));\n    lines.join("\\n")\n}\n\nfn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {\n    format!(\n        "  {:<24} {:<11} parent={}\\n    {}",\n        snapshot.id,\n        format_task_state(snapshot.state),\n        snapshot.parent_id.as_deref().unwrap_or("-"),\n        snapshot.description,\n    )\n}\n\nfn render_task_snapshot(snapshot: &runtime::SubagentSnapshot) -> String {\n    let mut lines = vec![\n        "Task".to_string(),\n        format!("  Agent            {}", snapshot.id),\n        format!("  State            {}", format_task_state(snapshot.state)),\n        format!("  Parent           {}", snapshot.parent_id.as_deref().unwrap_or("-")),\n        format!("  Description      {}", snapshot.description),\n    ];\n    if let Some(result) = snapshot.result.as_deref() { lines.push(format!("  Result           {result}")); }\n    if let Some(error) = snapshot.error.as_deref() { lines.push(format!("  Error            {error}")); }\n    lines.join("\\n")\n}\n\nfn format_task_state(state: runtime::SubagentState) -> &'static str {\n    match state {\n        runtime::SubagentState::Queued => "queued",\n        runtime::SubagentState::Running => "running",\n        runtime::SubagentState::Succeeded => "succeeded",\n        runtime::SubagentState::Failed => "failed",\n        runtime::SubagentState::Cancelled => "cancelled",\n    }\n}\n\n'''
              s = s.replace(marker, insert + marker)
          p.write_text(s)

          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          if 'render_tasks_report' not in s.split('use compat_harness',1)[0]:
              s = s.replace('handle_skills_slash_command, render_mcp_report, render_slash_command_help,', 'handle_skills_slash_command, render_mcp_report, render_slash_command_help, render_tasks_report,')
          if 'SlashCommand::Tasks { agent_id } => {' not in s:
              s = s.replace('''            SlashCommand::Skills { args } => {\n                Self::print_skills(args.as_deref())?;\n                false\n            }\n            SlashCommand::Branch { .. } => {''', '''            SlashCommand::Skills { args } => {\n                Self::print_skills(args.as_deref())?;\n                false\n            }\n            SlashCommand::Tasks { agent_id } => {\n                Self::print_tasks(agent_id.as_deref())?;\n                false\n            }\n            SlashCommand::Branch { .. } => {''')
          if 'fn print_tasks(' not in s:
              marker = '''    fn print_skills(args: Option<&str>) -> Result<(), Box<dyn std::error::Error>> {\n        let cwd = env::current_dir()?;\n        println!("{}", handle_skills_slash_command(args, &cwd)?);\n        Ok(())\n    }'''
              insert = marker + '''\n\n    fn print_tasks(agent_id: Option<&str>) -> Result<(), Box<dyn std::error::Error>> {\n        let snapshots = runtime::global_subagent_registry().snapshots()?;\n        println!("{}", render_tasks_report(&snapshots, agent_id));\n        Ok(())\n    }'''
              s = s.replace(marker, insert)
          if 'SlashCommand::Tasks { agent_id } => {' not in s[s.find('fn run_resume_command'):]:
              s = s.replace('''        SlashCommand::Skills { args } => {\n            let cwd = env::current_dir()?;\n            Ok(ResumeCommandOutcome {\n                session: session.clone(),\n                message: Some(handle_skills_slash_command(args.as_deref(), &cwd)?),\n            })\n        }\n        SlashCommand::Bughunter { .. }''', '''        SlashCommand::Skills { args } => {\n            let cwd = env::current_dir()?;\n            Ok(ResumeCommandOutcome {\n                session: session.clone(),\n                message: Some(handle_skills_slash_command(args.as_deref(), &cwd)?),\n            })\n        }\n        SlashCommand::Tasks { agent_id } => {\n            let snapshots = runtime::global_subagent_registry().snapshots()?;\n            Ok(ResumeCommandOutcome {\n                session: session.clone(),\n                message: Some(render_tasks_report(&snapshots, agent_id.as_deref())),\n            })\n        }\n        SlashCommand::Bughunter { .. }''')
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/commands/src/lib.rs rust/crates/claw-cli/src/main.rs
          git commit -m "feat: add registry-backed task inspection"
          git rm .github/workflows/phase-10d-implementation.yml .github/workflows/phase-10d-fix.yml .github/workflows/phase-10d-finalize.yml
          git commit -m "chore: remove temporary phase 10D workflows"
          git push
