name: phase-9b-repair-final
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair hook config borrow and dispatch matches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          old = '''            let hooks = root.get_mut("hooks").and_then(serde_json::Value::as_object_mut);\n            if root.get("hooks").is_some() && hooks.is_none() {\n                return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));\n            }\n            if root.get("hooks").is_none() {\n                root["hooks"] = serde_json::json!({});\n            }\n            let hooks = root.get_mut("hooks").and_then(serde_json::Value::as_object_mut).expect("hooks object");'''
          new = '''            if let Some(value) = root.get("hooks") {\n                if !value.is_object() {\n                    return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));\n                }\n            } else {\n                root["hooks"] = serde_json::json!({});\n            }\n            let hooks = root\n                .get_mut("hooks")\n                .and_then(serde_json::Value::as_object_mut)\n                .expect("hooks object");'''
          if old not in s:
              raise SystemExit('hook borrow block not found')
          s = s.replace(old, new, 1)
          stale = '''            "hooks" => Self::Config {\n                section: Some("hooks".to_string()),\n            },\n'''
          if stale in s:
              s = s.replace(stale, '', 1)
          dispatcher = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'''
          dispatcher2 = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,'''
          if dispatcher in s:
              s = s.replace(dispatcher, dispatcher2, 1)
          p.write_text(s)

          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          dispatcher = '''        | SlashCommand::Plugins { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),'''
          dispatcher2 = '''        | SlashCommand::Plugins { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),'''
          if dispatcher in s:
              s = s.replace(dispatcher, dispatcher2, 1)
          p.write_text(s)
          PY
          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Clean repair scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml .github/workflows/phase-9b-lastfix.yml .github/workflows/phase-9b-repair-final.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt .github/phase-9b-final-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hook management"
          git push
