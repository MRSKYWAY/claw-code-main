name: Phase 3C PR integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-3c-live-agent-dispatcher
          fetch-depth: 0

      - name: Execute integration script from temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/phase-3c-integrate.yml").read_text()
          match = re.search(r"\n      - name: Apply dispatcher integration\n        shell: python\n        run: \|\n(?P<body>.*?)(?=\n      - name: Remove temporary integration workflow\n)", workflow, re.S)
          if not match:
              raise SystemExit("could not extract integration script")
          script = textwrap.dedent(match.group("body"))
          exec(compile(script, "phase-3c-integrate.yml", "exec"), {})

      - name: Commit integrated source and remove temporary workflows
        run: |
          git rm .github/workflows/phase-3c-integrate.yml .github/workflows/phase-3-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/tools/src/lib.rs
          git commit -m "feat: integrate agent lifecycle and coordinator"
          git push origin phase-3c-live-agent-dispatcher
