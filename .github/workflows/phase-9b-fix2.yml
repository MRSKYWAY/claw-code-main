name: phase-9b-fix2
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate hooks parser arm and format Rust workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/commands/src/lib.rs')
          text = path.read_text()
          duplicate = '            "hooks" => Self::Config {\n                section: Some("hooks".to_string()),\n            },\n'
          assert text.count(duplicate) == 1
          path.write_text(text.replace(duplicate, '', 1))
          PY
          cd rust
          cargo fmt --all
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/phase-9b-fix-trigger.txt .github/phase-9b-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/commands/src/lib.rs rust/crates/claw-cli/src/main.rs PARITY.md .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/phase-9b-fix-trigger.txt .github/phase-9b-trigger.txt
          git commit -m "fix: clean up phase 9b hook parser"
          git push
