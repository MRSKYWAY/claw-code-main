name: Phase 7D PR verification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'phase-7d-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply Phase 7D regression fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('rust/crates/plugins/src/lib.rs')
          s = lib.read_text()
          old = '''        let mut child = process.spawn()?;
        if let Some(stdin) = child.stdin.as_mut() {
            use std::io::Write as _;
            stdin.write_all(input_json.as_bytes())?;
        }
'''
          new = '''        let mut child = process.spawn()?;
        if let Some(mut stdin) = child.stdin.take() {
            use std::io::Write as _;
            stdin.write_all(input_json.as_bytes())?;
        }
'''
          if old in s:
              s = s.replace(old, new, 1)
          lib.write_text(s)

          hooks = Path('rust/crates/plugins/src/hooks.rs')
          h = hooks.read_text()
          h = h.replace(
              '    use std::time::{SystemTime, UNIX_EPOCH};\n',
              '    use std::sync::{Mutex, OnceLock};\n    use std::time::{SystemTime, UNIX_EPOCH};\n',
              1,
          )
          if 'fn hook_env_lock()' not in h:
              marker = '''    fn temp_dir(label: &str) -> PathBuf {
'''
              helper = '''    fn hook_env_lock() -> std::sync::MutexGuard<'static, ()> {
        static LOCK: OnceLock<Mutex<()>> = OnceLock::new();
        LOCK.get_or_init(|| Mutex::new(())).lock().expect("hook env lock")
    }

'''
              if marker not in h:
                  raise SystemExit('hook test helper anchor not found')
              h = h.replace(marker, helper + marker, 1)
          h = h.replace(
              '    fn hook_timeout_warns_and_allows_tool_execution_to_continue() {\n        std::env::set_var(HOOK_TIMEOUT_ENV, "100");',
              '    fn hook_timeout_warns_and_allows_tool_execution_to_continue() {\n        let _lock = hook_env_lock();\n        std::env::set_var(HOOK_TIMEOUT_ENV, "100");',
              1,
          )
          h = h.replace(
              '    fn hook_timeout_configuration_is_clamped() {\n        std::env::set_var(HOOK_TIMEOUT_ENV, "1");',
              '    fn hook_timeout_configuration_is_clamped() {\n        let _lock = hook_env_lock();\n        std::env::set_var(HOOK_TIMEOUT_ENV, "1");',
              1,
          )
          hooks.write_text(h)
          PY
      - name: Commit regression fixes to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/plugins/src/lib.rs rust/crates/plugins/src/hooks.rs
          git diff --cached --quiet || git commit -m 'fix: close plugin stdin and isolate hook test env'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify and test
        working-directory: rust
        run: cargo test -p plugins
