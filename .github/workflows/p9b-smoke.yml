name: p9b-phase-9b
on:
  push:
    branches:
      - phase-9b-reimplementation
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine implementation state
        id: state
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "feat: add safe hook management commands" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply implementation
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/phase_9b_impl.py').read_text()
          source = source.split('\nPY\n', 1)[0]
          exec(compile(source, 'scripts/phase_9b_impl.py', 'exec'))
          PY
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Commit implementation
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add rust/crates/commands/src/lib.rs rust/crates/commands/src/hooks.rs rust/crates/claw-cli/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: add safe hook management commands'
          git push
