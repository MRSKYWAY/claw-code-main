name: phase-9b-repair5
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix hooks parser and run checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('rust/crates/commands/src/lib.rs')
          text = path.read_text()

          duplicate = re.compile(r'\n            "hooks" => Self::Config \{\s*section: Some\("hooks"\.to_string\(\)\),\s*\},')
          text, removed = duplicate.subn('', text, count=1)
          if removed != 1:
              raise SystemExit(f'expected one stale hooks parser arm, removed={removed}')

          stale = re.compile(r'''(SlashCommand::parse\("/hooks"\),\s*)Some\(SlashCommand::Config\s*\{\s*section:\s*Some\("hooks"\.to_string\(\)\)\s*\}\s*\)''')
          replacement = r'''\1Some(SlashCommand::Hooks { action: None, event: None, command: None })'''
          text, changed = stale.subn(replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'expected one stale hooks test expectation, changed={changed}')

          path.write_text(text)
          PY
          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Clean temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hook management"
          git push
