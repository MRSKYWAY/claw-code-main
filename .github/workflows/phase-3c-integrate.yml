name: Phase 3C integration

on:
  push:
    branches:
      - phase-3c-live-agent-dispatcher

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-3c-live-agent-dispatcher
          fetch-depth: 0

      - name: Apply dispatcher integration
        shell: python
        run: |
          from pathlib import Path

          path = Path("rust/crates/tools/src/lib.rs")
          s = path.read_text()

          replacements = [
              (
                  'use std::sync::{Mutex, OnceLock};',
                  'use std::sync::OnceLock;',
              ),
              (
                  'use serde_json::{json, Value};',
                  'use serde_json::{json, Value};\n\nmod agent_lifecycle;\n\nuse crate::agent_lifecycle::{atomic_write, AgentCoordinator, AgentLifecycle, AgentStatus};',
              ),
              (
                  '''struct AgentJob {\n    manifest: AgentOutput,\n    prompt: String,\n    system_prompt: Vec<String>,\n    allowed_tools: BTreeSet<String>,\n}''',
                  '''struct AgentJob {\n    manifest: AgentOutput,\n    prompt: String,\n    system_prompt: Vec<String>,\n    allowed_tools: BTreeSet<String>,\n    lifecycle: AgentLifecycle,\n}''',
              ),
              (
                  '''const DEFAULT_AGENT_MODEL: &str = "nvidia-agent";\nconst DEFAULT_AGENT_SYSTEM_DATE: &str = "2026-03-31";\nconst DEFAULT_MAX_PARALLEL_AGENTS: usize = 2;\nstatic ACTIVE_AGENT_COUNT: OnceLock<Mutex<usize>> = OnceLock::new();''',
                  '''const DEFAULT_AGENT_MODEL: &str = "nvidia-agent";\nconst DEFAULT_AGENT_SYSTEM_DATE: &str = "2026-03-31";\nstatic AGENT_COORDINATOR: OnceLock<AgentCoordinator> = OnceLock::new();\n\nfn agent_coordinator() -> &'static AgentCoordinator {\n    AGENT_COORDINATOR.get_or_init(AgentCoordinator::configured_from_env)\n}\n\nfn persisted_agent_status(status: AgentStatus) -> &'static str {\n    match status {\n        AgentStatus::Queued => "queued",\n        AgentStatus::Running => "running",\n        AgentStatus::Succeeded => "completed",\n        AgentStatus::Failed => "failed",\n        AgentStatus::Cancelled => "cancelled",\n    }\n}''',
              ),
              (
                  'std::fs::write(&output_file, output_contents).map_err(|error| error.to_string())?;',
                  'atomic_write(&output_file, &output_contents).map_err(|error| error.to_string())?;',
              ),
              (
                  'status: String::from("running"),\n        output_file:',
                  'status: String::from("queued"),\n        output_file:',
              ),
              (
                  'started_at: Some(created_at),\n        completed_at: None,',
                  'started_at: None,\n        completed_at: None,',
              ),
              (
                  '''        system_prompt,\n        allowed_tools,\n    };''',
                  '''        system_prompt,\n        allowed_tools,\n        lifecycle: AgentLifecycle::new(),\n    };''',
              ),
              (
                  '''    if let Err(error) = spawn_fn(job) {\n        let error = format!("failed to spawn sub-agent: {error}");\n        persist_agent_terminal_state(&manifest, "failed", None, Some(error.clone()))?;\n        return Err(error);\n    }''',
                  '''    if let Err(error) = spawn_fn(job) {\n        let error = format!("failed to spawn sub-agent: {error}");\n        let mut lifecycle = AgentLifecycle::new();\n        persist_agent_terminal_state(\n            &manifest,\n            &mut lifecycle,\n            AgentStatus::Failed,\n            None,\n            Some(error.clone()),\n        )?;\n        return Err(error);\n    }''',
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"missing expected source block: {old[:80]!r}")
              s = s.replace(old, new, 1)

          old_spawn = '''fn spawn_agent_job(job: AgentJob) -> Result<(), String> {\n    reserve_agent_slot()?;\n    let thread_name = format!("claw-agent-{}", job.manifest.agent_id);\n    std::thread::Builder::new()\n        .name(thread_name)\n        .spawn(move || {\n            let result =\n                std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| run_agent_job(&job)));\n            match result {\n                Ok(Ok(())) => {}\n                Ok(Err(error)) => {\n                    let _ =\n                        persist_agent_terminal_state(&job.manifest, "failed", None, Some(error));\n                }\n                Err(_) => {\n                    let _ = persist_agent_terminal_state(\n                        &job.manifest,\n                        "failed",\n                        None,\n                        Some(String::from("sub-agent thread panicked")),\n                    );\n                }\n            }\n            release_agent_slot();\n        })\n        .map(|_| ())\n        .map_err(|error| {\n            release_agent_slot();\n            error.to_string()\n        })\n}\n\nfn reserve_agent_slot() -> Result<(), String> {\n    let active = ACTIVE_AGENT_COUNT.get_or_init(|| Mutex::new(0));\n    let mut active = active\n        .lock()\n        .map_err(|_| "agent coordinator lock poisoned")?;\n    let limit = std::env::var("CLAW_MAX_PARALLEL_AGENTS")\n        .ok()\n        .and_then(|value| value.parse::<usize>().ok())\n        .filter(|value| (1..=8).contains(value))\n        .unwrap_or(DEFAULT_MAX_PARALLEL_AGENTS);\n    if *active >= limit {\n        return Err(format!(\n            "agent coordinator is at capacity ({limit}); wait for an active agent"\n        ));\n    }\n    *active += 1;\n    Ok(())\n}\n\nfn release_agent_slot() {\n    if let Some(active) = ACTIVE_AGENT_COUNT.get() {\n        if let Ok(mut active) = active.lock() {\n            *active = active.saturating_sub(1);\n        }\n    }\n}\n\nfn run_agent_job(job: &AgentJob) -> Result<(), String> {\n    let subagent_type = job\n        .manifest\n        .subagent_type\n        .as_deref()\n        .unwrap_or("general-purpose");\n    let mut runtime =\n        build_agent_runtime(job)?.with_max_iterations(max_iterations_for_subagent(subagent_type));\n    let summary = runtime\n        .run_turn(job.prompt.clone(), None)\n        .map_err(|error| error.to_string())?;\n    let final_text = final_assistant_text(&summary);\n    persist_agent_terminal_state(&job.manifest, "completed", Some(final_text.as_str()), None)\n}'''

          new_spawn = '''fn spawn_agent_job(mut job: AgentJob) -> Result<(), String> {\n    let permit = agent_coordinator().try_acquire()?;\n    let thread_name = format!("claw-agent-{}", job.manifest.agent_id);\n    std::thread::Builder::new()\n        .name(thread_name)\n        .spawn(move || {\n            let _permit = permit;\n            let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {\n                run_agent_job(&mut job)\n            }));\n            if result.is_err() {\n                let _ = persist_agent_terminal_state(\n                    &job.manifest,\n                    &mut job.lifecycle,\n                    AgentStatus::Failed,\n                    None,\n                    Some(String::from("sub-agent thread panicked")),\n                );\n            }\n        })\n        .map(|_| ())\n        .map_err(|error| error.to_string())\n}\n\nfn run_agent_job(job: &mut AgentJob) -> Result<(), String> {\n    job.lifecycle\n        .transition(AgentStatus::Running)\n        .map_err(|error| error.to_string())?;\n    let mut running_manifest = job.manifest.clone();\n    running_manifest.status = persisted_agent_status(AgentStatus::Running).to_string();\n    running_manifest.started_at = Some(iso8601_now());\n    write_agent_manifest(&running_manifest)?;\n    job.manifest = running_manifest;\n\n    let subagent_type = job\n        .manifest\n        .subagent_type\n        .as_deref()\n        .unwrap_or("general-purpose");\n    let result = (|| {\n        let mut runtime = build_agent_runtime(job)?\n            .with_max_iterations(max_iterations_for_subagent(subagent_type));\n        let summary = runtime\n            .run_turn(job.prompt.clone(), None)\n            .map_err(|error| error.to_string())?;\n        Ok(final_assistant_text(&summary))\n    })();\n\n    match result {\n        Ok(final_text) => {\n            persist_agent_terminal_state(\n                &job.manifest,\n                &mut job.lifecycle,\n                AgentStatus::Succeeded,\n                Some(final_text.as_str()),\n                None,\n            )\n        }\n        Err(error) => {\n            persist_agent_terminal_state(\n                &job.manifest,\n                &mut job.lifecycle,\n                AgentStatus::Failed,\n                None,\n                Some(error.clone()),\n            )?;\n            Err(error)\n        }\n    }\n}'''

          if old_spawn not in s:
              raise SystemExit("missing expected spawn implementation")
          s = s.replace(old_spawn, new_spawn, 1)

          old_manifest = '''fn write_agent_manifest(manifest: &AgentOutput) -> Result<(), String> {\n    std::fs::write(\n        &manifest.manifest_file,\n        serde_json::to_string_pretty(manifest).map_err(|error| error.to_string())?,\n    )\n    .map_err(|error| error.to_string())\n}\n\nfn persist_agent_terminal_state(\n    manifest: &AgentOutput,\n    status: &str,\n    result: Option<&str>,\n    error: Option<String>,\n) -> Result<(), String> {\n    append_agent_output(\n        &manifest.output_file,\n        &format_agent_terminal_output(status, result, error.as_deref()),\n    )?;\n    let mut next_manifest = manifest.clone();\n    next_manifest.status = status.to_string();\n    next_manifest.completed_at = Some(iso8601_now());\n    next_manifest.error = error;\n    write_agent_manifest(&next_manifest)\n}'''

          new_manifest = '''fn write_agent_manifest(manifest: &AgentOutput) -> Result<(), String> {\n    let contents = serde_json::to_string_pretty(manifest).map_err(|error| error.to_string())?;\n    atomic_write(Path::new(&manifest.manifest_file), &contents)\n        .map_err(|error| error.to_string())\n}\n\nfn persist_agent_terminal_state(\n    manifest: &AgentOutput,\n    lifecycle: &mut AgentLifecycle,\n    status: AgentStatus,\n    result: Option<&str>,\n    error: Option<String>,\n) -> Result<(), String> {\n    lifecycle\n        .transition(status)\n        .map_err(|transition| transition.to_string())?;\n    let persisted_status = persisted_agent_status(status);\n    append_agent_output(\n        &manifest.output_file,\n        &format_agent_terminal_output(persisted_status, result, error.as_deref()),\n    )?;\n    let mut next_manifest = manifest.clone();\n    next_manifest.status = persisted_status.to_string();\n    next_manifest.completed_at = Some(iso8601_now());\n    next_manifest.error = error;\n    write_agent_manifest(&next_manifest)\n}'''

          if old_manifest not in s:
              raise SystemExit("missing expected manifest implementation")
          s = s.replace(old_manifest, new_manifest, 1)

          path.write_text(s)

      - name: Remove temporary integration workflow
        run: |
          git rm .github/workflows/phase-3c-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/tools/src/lib.rs
          git commit -m "feat: integrate agent lifecycle and coordinator"
          git push origin phase-3c-live-agent-dispatcher
