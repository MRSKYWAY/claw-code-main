name: p9b-target
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase-9b-reimplementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Implement and validate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "feat: add safe hook management commands" ]; then
            echo 'Already committed.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/phase_9b_impl.py').read_text().split('\nPY\n', 1)[0]
          exec(compile(source, 'scripts/phase_9b_impl.py', 'exec'))
          PY
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p commands --lib
          cargo check -p claw-cli
          cd ..
          git add rust/crates/commands/src/lib.rs rust/crates/commands/src/hooks.rs rust/crates/claw-cli/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: add safe hook management commands'
          git push origin HEAD:phase-9b-reimplementation
