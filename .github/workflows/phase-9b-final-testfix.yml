name: phase-9b-final-testfix
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final source and test fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/commands/src/lib.rs')
          lines = p.read_text().splitlines()

          # Remove stale duplicate parser arm only within parse().
          in_parse = False
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() == 'pub fn parse(input: &str) -> Option<Self> {':
                  in_parse = True
              if in_parse and line.strip() == '"hooks" => Self::Config {':
                  if i + 2 < len(lines) and lines[i+1].strip() == 'section: Some("hooks".to_string()),' and lines[i+2].strip() == '},':
                      i += 3
                      continue
              out.append(line)
              if in_parse and line.strip() == '}' and i > 0 and lines[i-1].strip().startswith('other =>'):
                  in_parse = False
              i += 1
          lines = out

          # Fix the mutable/immutable borrow overlap around root/hooks.
          start = next((i for i, line in enumerate(lines) if 'let hooks = root.get_mut("hooks").and_then(serde_json::Value::as_object_mut);' in line), None)
          if start is not None:
              end = next((i for i in range(start, min(start + 12, len(lines))) if 'expect("hooks object")' in lines[i]), None)
              if end is None:
                  raise SystemExit('hook borrow terminator not found')
              lines[start:end+1] = [
                  '            if let Some(value) = root.get("hooks") {',
                  '                if !value.is_object() {',
                  '                    return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));',
                  '                }',
                  '            } else {',
                  '                root["hooks"] = serde_json::json!({});',
                  '            }',
                  '            let hooks = root',
                  '                .get_mut("hooks")',
                  '                .and_then(serde_json::Value::as_object_mut)',
                  '                .expect("hooks object");',
              ]

          text = '\n'.join(lines) + '\n'
          # Cover Hooks in handle_slash_command's fallback match.
          start_pos = text.find('pub fn handle_slash_command(')
          end_pos = text.find('\n}\n\n#[cfg(test)]', start_pos)
          if start_pos < 0 or end_pos < 0:
              raise SystemExit('handle_slash_command boundaries not found')
          section = text[start_pos:end_pos]
          if '| SlashCommand::Hooks { .. }' not in section:
              target = '        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'
              if target not in section:
                  raise SystemExit('handle_slash_command Hooks target not found')
              section = section.replace(target, '        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,', 1)
              text = text[:start_pos] + section + text[end_pos:]

          # Update the shared parser regression expectation.
          text = text.replace(
              '''        assert_eq!(SlashCommand::parse("/hooks"), Some(SlashCommand::Config { section: Some("hooks".to_string()) }));''',
              '''        assert_eq!(SlashCommand::parse("/hooks"), Some(SlashCommand::Hooks { action: None, event: None, command: None }));''',
              1,
          )
          text = text.replace(
              '''        assert_eq!(\n            SlashCommand::parse("/hooks"),\n            Some(SlashCommand::Config {\n                section: Some("hooks".to_string()),\n            })\n        );''',
              '''        assert_eq!(\n            SlashCommand::parse("/hooks"),\n            Some(SlashCommand::Hooks {\n                action: None,\n                event: None,\n                command: None,\n            })\n        );''',
              1,
          )
          p.write_text(text)

          p = Path('rust/crates/claw-cli/src/main.rs')
          text = p.read_text()
          start_pos = text.find('fn run_resume_command(')
          end_pos = text.find('\n}\n', start_pos)
          if start_pos < 0 or end_pos < 0:
              raise SystemExit('run_resume_command boundaries not found')
          section = text[start_pos:end_pos]
          target = '        | SlashCommand::Plugins { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),'
          if '| SlashCommand::Hooks { .. }' not in section:
              if target not in section:
                  raise SystemExit('run_resume_command Hooks target not found')
              section = section.replace(target, '        | SlashCommand::Plugins { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),', 1)
              text = text[:start_pos] + section + text[end_pos:]
          p.write_text(text)
          PY
          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Clean repair scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml .github/workflows/phase-9b-lastfix.yml .github/workflows/phase-9b-repair-final.yml .github/workflows/phase-9b-final-testfix.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt .github/phase-9b-final-trigger.txt .github/phase-9b-repair-final-trigger.txt .github/phase-9b-deterministic-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hooks"
          git push
