name: CI

on:
  push:
    branches:
      - main
      - phase-10d-clean
  pull_request:
    branches:
      - main

jobs:
  repair-phase-10d:
    name: repair-phase-10d
    if: github.ref == 'refs/heads/phase-10d-clean' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Phase 10D test fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          s = s.replace('"version", "export", "agents", "skills",\n            ]', '"version", "export", "agents", "skills", "tasks",\n            ]', 1)
          p.write_text(s)

          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          s = s.replace('assert_eq!(slash_command_specs().len(), 30);', 'assert_eq!(slash_command_specs().len(), 31);', 1)
          s = s.replace('assert_eq!(resume_supported_slash_commands().len(), 15);', 'assert_eq!(resume_supported_slash_commands().len(), 16);', 1)
          start = s.index('fn render_task_row(')
          end = s.index('\nfn render_task_snapshot(', start)
          new_fn = '''fn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {
    let parent = snapshot.parent_id.as_deref().unwrap_or("-");
    let result = snapshot
        .result
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Result           {value}"));
    let error = snapshot
        .error
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Error            {value}"));
    format!(
        "  {:<24} {:<11} parent={parent}\\n    {}{result}{error}",
        snapshot.id,
        format_task_state(snapshot.state),
        snapshot.description,
    )
}'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          PY
      - name: Run targeted Phase 10D tests
        working-directory: rust
        run: |
          cargo test -p claw-cli --bin claw resume_supported_command_list_matches_expected_surface
          cargo test -p commands --lib tasks_command_parses_and_renders_registry_state
      - name: Run full workspace tests
        working-directory: rust
        run: cargo test --workspace --exclude tools
      - name: Commit final Phase 10D source and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/ci.yml
          git add rust/crates/claw-cli/src/main.rs rust/crates/commands/src/lib.rs .github/workflows/ci.yml
          git commit -m "fix: finish Phase 10D test surface"
          git push origin HEAD:phase-10d-clean

  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo clippy (workspace libraries and binaries)
        working-directory: rust
        run: cargo clippy --workspace --lib --bins

      - name: Run cargo clippy (commands, all targets)
        working-directory: rust
        run: cargo clippy -p commands --all-targets

      - name: Run cargo check
        working-directory: rust
        run: cargo check --workspace

      - name: Run cargo test (workspace packages except tools test target)
        working-directory: rust
        run: cargo test --workspace --exclude tools

      - name: Run release build
        working-directory: rust
        run: cargo build --release
