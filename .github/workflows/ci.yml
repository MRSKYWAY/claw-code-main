name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  phase-10d-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase-10d-task-inspection' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 10D branch
        uses: actions/checkout@v4
        with:
          ref: phase-10d-task-inspection
          fetch-depth: 0
      - name: Apply Phase 10D source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          old = 'assert_eq!(slash_command_specs().len(), 30);'
          if old not in s:
              raise SystemExit('expected help-count assertion not found')
          s = s.replace(old, 'assert_eq!(slash_command_specs().len(), 31);', 1)
          start = s.index('fn render_task_row(')
          end = s.index('\nfn render_task_snapshot(', start)
          new = '''fn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {
    let parent = snapshot.parent_id.as_deref().unwrap_or("-");
    let result = snapshot
        .result
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Result           {value}"));
    let error = snapshot
        .error
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Error            {value}"));
    format!(
        "  {:<24} {:<11} parent={parent}\\n    {}{result}{error}",
        snapshot.id,
        format_task_state(snapshot.state),
        snapshot.description,
    )
}'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Verify targeted test
        working-directory: rust
        run: cargo test -p commands tasks_command_parses_and_renders_registry_state --lib
      - name: Commit source fix and clean branch workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/phase-10d-*.yml
          git add rust/crates/commands/src/lib.rs .github/workflows
          git diff --cached --check
          git commit -m 'fix: complete phase 10d task inspection'
          git push origin HEAD:phase-10d-task-inspection

  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo clippy (workspace libraries and binaries)
        working-directory: rust
        run: cargo clippy --workspace --lib --bins

      - name: Run cargo clippy (commands, all targets)
        working-directory: rust
        run: cargo clippy -p commands --all-targets

      - name: Run cargo check
        working-directory: rust
        run: cargo check --workspace

      - name: Run cargo test (workspace packages except tools test target)
        working-directory: rust
        run: cargo test --workspace --exclude tools

      - name: Run release build
        working-directory: rust
        run: cargo build --release
