name: phase-9b-repair4
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update stale hook parser expectation and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/commands/src/lib.rs')
          text = path.read_text()
          old = '''        assert_eq!(\n            SlashCommand::parse("/hooks"),\n            Some(SlashCommand::Config {\n                section: Some("hooks".to_string()),\n            })\n        );\n'''
          new = '''        assert_eq!(\n            SlashCommand::parse("/hooks"),\n            Some(SlashCommand::Hooks {\n                action: None,\n                event: None,\n                command: None,\n            })\n        );\n'''
          if old not in text:
              raise SystemExit('stale /hooks parser expectation not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd rust
          cargo fmt --all
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Commit source fix and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: update hooks slash command expectation"
          git push
