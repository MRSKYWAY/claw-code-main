name: Phase 4B runner

on:
  push:
    branches: [phase-4b-stdin-cli]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4b-stdin-cli
          fetch-depth: 0
      - name: Patch source
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("rust/crates/claw-cli/src/main.rs"); s=p.read_text(); old=base64.b64decode("ICAgICAgICBsZXQgcHJvbXB0ID0gZnM6OnJlYWRfdG9fc3RyaW5nKCZwYXRoKQogICAgICAgICAgICAubWFwX2Vycih8ZXJyb3J8IGZvcm1hdCEoImNvdWxkIG5vdCByZWFkIHByb21wdCBmaWxlIHt9OiB7ZXJyb3J9IiwgcGF0aC5kaXNwbGF5KCkpKT87").decode(); new=base64.b64decode("").decode(); assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Add regression test
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("rust/crates/claw-cli/src/main.rs"); s=p.read_text(); marker=base64.b64decode("Zm4gam9pbl9vcHRpb25hbF9hcmdzKGFyZ3M6ICZbU3RyaW5nXSkgLT4gT3B0aW9uPFN0cmluZz4gew==").decode(); tests=base64.b64decode("").decode(); assert marker in s; p.write_text(s.replace(marker,tests+marker,1))'
      - name: Run regression test
        working-directory: rust
        run: cargo test -p claw-cli stdin_prompt_tests
      - name: Commit source and clean up
        run: |
          git rm .github/workflows/phase-4b-integrate.yml .github/workflows/phase-4b-run.yml phase4b.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/claw-cli/src/main.rs
          git commit -m "feat: support stdin prompt input"
          git push origin phase-4b-stdin-cli
