name: Phase 7A Skill Resolution
on:
  push:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden skill resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/tools/src/lib.rs')
          s = p.read_text()
          start = s.index('fn resolve_skill_path(skill: &str) -> Result<std::path::PathBuf, String> {')
          end = s.index('\n}\n\nconst DEFAULT_AGENT_MODEL', start) + 2
          new = r'''fn resolve_skill_path(skill: &str) -> Result<std::path::PathBuf, String> {
    let requested = skill.trim().trim_start_matches('/').trim_start_matches('$');
    if requested.is_empty() {
        return Err(String::from("skill must not be empty"));
    }
    if requested.contains('/') || requested.contains('\\') || requested == "." || requested == ".." {
        return Err(String::from("skill name must not contain path separators"));
    }
    let cwd = std::env::current_dir().map_err(|error| error.to_string())?;
    let mut roots = Vec::new();
    for ancestor in cwd.ancestors() {
        roots.push(ancestor.join(".claw").join("skills"));
        roots.push(ancestor.join(".codex").join("skills"));
        roots.push(ancestor.join(".claw").join("commands"));
        roots.push(ancestor.join(".codex").join("commands"));
    }
    if let Ok(codex_home) = std::env::var("CODEX_HOME") {
        let home = std::path::PathBuf::from(codex_home);
        roots.push(home.join("skills"));
        roots.push(home.join("commands"));
    }
    if let Some(home) = std::env::var_os("HOME") {
        let home = std::path::PathBuf::from(home);
        roots.push(home.join(".claw").join("skills"));
        roots.push(home.join(".codex").join("skills"));
        roots.push(home.join(".claw").join("commands"));
        roots.push(home.join(".codex").join("commands"));
    }
    if let Ok(extra) = std::env::var("CLAW_SKILL_PATHS") {
        roots.extend(std::env::split_paths(&extra));
    }
    let mut seen = std::collections::BTreeSet::new();
    for root in roots {
        if !seen.insert(root.clone()) { continue; }
        let direct = root.join(requested).join("SKILL.md");
        if direct.is_file() { return Ok(direct); }
        let direct_file = root.join(requested);
        if direct_file.is_file() { return Ok(direct_file); }
        if let Ok(entries) = std::fs::read_dir(&root) {
            for entry in entries.flatten() {
                if !entry.file_name().to_string_lossy().eq_ignore_ascii_case(requested) { continue; }
                let path = if entry.path().is_dir() { entry.path().join("SKILL.md") } else { entry.path() };
                if path.is_file() { return Ok(path); }
            }
        }
    }
    Err(format!("unknown skill: {requested}"))
}'''
          s = s[:start] + new + s[end:]
          marker = '\nconst DEFAULT_AGENT_MODEL'
          test = r'''

#[cfg(test)]
mod skill_resolution_tests {
    use std::env;
    use std::fs;
    use std::sync::Mutex;
    static ENV_LOCK: Mutex<()> = Mutex::new(());
    #[test]
    fn rejects_skill_path_traversal() {
        let _guard = ENV_LOCK.lock().expect("env lock");
        assert!(super::resolve_skill_path("../secret").is_err());
        assert!(super::resolve_skill_path("nested/secret").is_err());
    }
    #[test]
    fn resolves_from_configured_skill_path() {
        let _guard = ENV_LOCK.lock().expect("env lock");
        let temp = env::temp_dir().join(format!("claw-skill-test-{}", std::process::id()));
        let skill_dir = temp.join("demo");
        fs::create_dir_all(&skill_dir).expect("skill dir");
        fs::write(skill_dir.join("SKILL.md"), "---\nname: demo\n---\n\n# Demo\n").expect("skill file");
        let previous = env::var_os("CLAW_SKILL_PATHS");
        env::set_var("CLAW_SKILL_PATHS", &temp);
        let resolved = super::resolve_skill_path("demo").expect("configured skill resolves");
        assert_eq!(resolved, skill_dir.join("SKILL.md"));
        match previous { Some(value) => env::set_var("CLAW_SKILL_PATHS", value), None => env::remove_var("CLAW_SKILL_PATHS") }
        let _ = fs::remove_dir_all(temp);
    }
}
'''
          if 'mod skill_resolution_tests' not in s: s += test
          p.write_text(s)
          PY
      - name: Verify
        run: cargo test --manifest-path rust/Cargo.toml -p tools skill_resolution_tests -- --nocapture
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/tools/src/lib.rs
          git commit -m 'feat: harden skill discovery and resolution'
          git push
