name: Apply runtime regression fixes
on:
  pull_request:
    types: [edited]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ github.token }}
      - name: Patch runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hooks = Path('rust/crates/plugins/src/hooks.rs')
          text = hooks.read_text()
          old = '''        let mut child = self.command.spawn()?;\n        if let Some(mut child_stdin) = child.stdin.take() {\n            use std::io::Write as _;\n            child_stdin.write_all(stdin)?;\n        }'''
          new = '''        let mut child = self.command.spawn()?;\n        if let Some(mut child_stdin) = child.stdin.take() {\n            use std::io::Write as _;\n            if let Err(error) = child_stdin.write_all(stdin) {\n                if error.kind() != std::io::ErrorKind::BrokenPipe {\n                    return Err(error);\n                }\n            }\n        }'''
          if old in text:
              text = text.replace(old, new, 1)
          old = '''            if started.elapsed() >= Duration::from_millis(timeout) {\n                let _ = child.kill();\n                let output = child.wait_with_output()?;\n                return Ok(CommandOutput::TimedOut { output, timeout });\n            }'''
          new = '''            if started.elapsed() >= Duration::from_millis(timeout) {\n                let _ = child.kill();\n                let status = child.wait()?;\n                let output = std::process::Output {\n                    status,\n                    stdout: Vec::new(),\n                    stderr: Vec::new(),\n                };\n                return Ok(CommandOutput::TimedOut { output, timeout });\n            }'''
          if old in text:
              text = text.replace(old, new, 1)
          hooks.write_text(text)

          test = Path('rust/crates/plugins/tests/manager_lifecycle.rs')
          text = test.read_text()
          if 'AtomicU64' not in text:
              text = text.replace('use std::time::{SystemTime, UNIX_EPOCH};', 'use std::sync::atomic::{AtomicU64, Ordering};\nuse std::time::{SystemTime, UNIX_EPOCH};', 1)
          old = '''        let nanos = SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .expect("system clock should be after unix epoch")\n            .as_nanos();\n        let path = std::env::temp_dir().join(format!("{prefix}-{nanos}"));'''
          new = '''        static NEXT_ID: AtomicU64 = AtomicU64::new(0);\n        let nanos = SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .expect("system clock should be after unix epoch")\n            .as_nanos();\n        let unique_id = NEXT_ID.fetch_add(1, Ordering::Relaxed);\n        let path = std::env::temp_dir().join(format!(\n            "{prefix}-{}-{nanos}-{unique_id}",\n            std::process::id()\n        ));'''
          if old in text:
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY
      - name: Targeted plugin tests and capture output
        working-directory: rust
        shell: bash
        run: |
          set +e
          {
            echo '=== manager_lifecycle ==='
            cargo test -p plugins --test manager_lifecycle
            manager_status=$?
            echo "manager_status=$manager_status"
            echo '=== plugins lib ==='
            cargo test -p plugins --lib
            lib_status=$?
            echo "lib_status=$lib_status"
            echo "overall_status=$(( manager_status || lib_status ))"
          } 2>&1 | tee ../plugin-regression-output.txt
          exit 0
      - name: Commit fixes and captured output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/plugins/src/hooks.rs rust/crates/plugins/tests/manager_lifecycle.rs plugin-regression-output.txt .github/workflows/apply-runtime-regression-fixes.yml
          git commit -m "fix: harden plugin subprocess lifecycle" || true
          git push