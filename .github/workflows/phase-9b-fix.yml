name: phase-9b-fix
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate hooks parser arm and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/commands/src/lib.rs')
          text = path.read_text()
          duplicate = '''            "hooks" => Self::Config {\n                section: Some("hooks".to_string()),\n            },\n'''
          count = text.count(duplicate)
          assert count == 1, f"expected exactly one stale duplicate hooks arm, found {count}"
          text = text.replace(duplicate, '', 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/phase-9b-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/commands/src/lib.rs .github/workflows/phase-9b-fix.yml
          git commit -m "fix: remove duplicate hooks command parser arm"
          git push
