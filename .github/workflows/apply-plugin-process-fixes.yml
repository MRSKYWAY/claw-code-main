name: Apply plugin process fixes

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'phase-9c-mcp-inspector' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Patch process handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hooks = Path('rust/crates/plugins/src/hooks.rs')
          text = hooks.read_text()
          old = '''                let _ = child.kill();
                let output = child.wait_with_output()?;
                return Ok(CommandOutput::TimedOut { output, timeout });'''
          new = '''                let _ = child.kill();
                let status = child.wait()?;
                let output = std::process::Output {
                    status,
                    stdout: Vec::new(),
                    stderr: Vec::new(),
                };
                return Ok(CommandOutput::TimedOut { output, timeout });'''
          if old not in text:
              raise SystemExit('hooks timeout block not found')
          hooks.write_text(text.replace(old, new, 1))

          lib = Path('rust/crates/plugins/src/lib.rs')
          text = lib.read_text()
          old = '''        let mut child = process.spawn()?;
        if let Some(stdin) = child.stdin.as_mut() {
            use std::io::Write as _;
            stdin.write_all(input_json.as_bytes())?;
        }'''
          new = '''        let mut child = process.spawn()?;
        if let Some(mut stdin) = child.stdin.take() {
            use std::io::Write as _;
            stdin.write_all(input_json.as_bytes())?;
        }'''
          if old not in text:
              raise SystemExit('plugin tool stdin block not found')
          lib.write_text(text.replace(old, new, 1))
          PY

      - name: Verify targeted tests
        working-directory: rust
        run: |
          cargo test -p plugins --lib hooks::tests::hook_timeout_warns_and_allows_tool_execution_to_continue
          cargo test -p plugins --lib tests::aggregates_and_executes_plugin_tools

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-plugin-process-fixes.yml
          git add rust/crates/plugins/src/hooks.rs rust/crates/plugins/src/lib.rs
          git commit -m 'fix: close plugin stdin and avoid timeout pipe waits'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
