name: Phase 10D targeted fix

on:
  push:
    branches: [phase-10d-task-inspection]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-10d-task-inspection
          fetch-depth: 0
      - name: Apply exact fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              'rust/crates/commands/src/lib.rs': [
                  (
                      '        | SlashCommand::Agents { .. }\n'
                      '        | SlashCommand::Skills { .. }\n'
                      '        | SlashCommand::Mcp\n',
                      '        | SlashCommand::Agents { .. }\n'
                      '        | SlashCommand::Skills { .. }\n'
                      '        | SlashCommand::Tasks { .. }\n'
                      '        | SlashCommand::Mcp\n',
                  ),
              ],
              'rust/crates/api/src/providers/gemini.rs': [
                  (
                      '        Some("STOP") | Some("FINISH_REASON_UNSPECIFIED") | None => {',
                      '        Some("STOP" | "FINISH_REASON_UNSPECIFIED") | None => {',
                  ),
              ],
          }

          for name, replacements in fixes.items():
              path = Path(name)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/commands/src/lib.rs rust/crates/api/src/providers/gemini.rs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete phase 10d command match and clippy pattern'
          git push origin phase-10d-task-inspection
