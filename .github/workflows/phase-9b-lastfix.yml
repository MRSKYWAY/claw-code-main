name: phase-9b-lastfix
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final exhaustive match fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('rust/crates/commands/src/lib.rs')
          text = path.read_text()

          # Remove any stale duplicate parser arm.
          text = re.sub(
              r'\n\s*"hooks"\s*=>\s*Self::Config\s*\{\s*section:\s*Some\("hooks"\.to_string\(\)\),\s*\},',
              '', text, count=1
          )

          # Cover Hooks in the main slash dispatcher.
          target = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'''
          replacement = '''        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,'''
          if target not in text:
              raise SystemExit('commands dispatcher match target not found')
          text = text.replace(target, replacement, 1)

          # Update stale parser expectation if present.
          stale = '''Some(SlashCommand::Config {\n                section: Some("hooks".to_string()),\n            })'''
          if stale in text and 'SlashCommand::Hooks {' not in text[text.find('SlashCommand::parse("/hooks")'):text.find('SlashCommand::parse("/hooks")')+500]:
              text = text.replace(stale, 'Some(SlashCommand::Hooks { action: None, event: None, command: None })', 1)

          path.write_text(text)

          path = Path('rust/crates/claw-cli/src/main.rs')
          text = path.read_text()
          target = '''        | SlashCommand::Plugins { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),'''
          replacement = '''        | SlashCommand::Plugins { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),'''
          if target not in text:
              raise SystemExit('claw-cli resume dispatcher match target not found')
          path.write_text(text.replace(target, replacement, 1))
          PY
          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Remove temporary patch workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml .github/workflows/phase-9b-finalizer.yml .github/workflows/phase-9b-lastfix.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b command dispatch"
          git push
