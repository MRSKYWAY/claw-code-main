name: Phase 6B Bootstrap
on: [push]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/phase-6b-mcp-tool-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply MCP registry wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          tools = root / 'rust/crates/tools/src/lib.rs'
          text = tools.read_text()
          text = text.replace('use std::sync::OnceLock;', 'use std::sync::{Arc, Mutex, OnceLock};', 1)
          text = text.replace('#[derive(Debug, Clone, PartialEq)]\npub struct GlobalToolRegistry {\n    plugin_tools: Vec<PluginTool>,\n}', '#[derive(Debug, Clone)]\npub struct GlobalToolRegistry {\n    plugin_tools: Vec<PluginTool>,\n    mcp_tools: Vec<runtime::McpTool>,\n    mcp_manager: Option<Arc<Mutex<runtime::McpServerManager>>>,\n}\n\nimpl PartialEq for GlobalToolRegistry {\n    fn eq(&self, other: &Self) -> bool {\n        self.plugin_tools == other.plugin_tools && self.mcp_tools == other.mcp_tools\n    }\n}', 1)
          text = text.replace('        Self {\n            plugin_tools: Vec::new(),\n        }', '        Self { plugin_tools: Vec::new(), mcp_tools: Vec::new(), mcp_manager: None }', 1)
          text = text.replace('        Ok(Self { plugin_tools })', '        Ok(Self { plugin_tools, mcp_tools: Vec::new(), mcp_manager: None })', 1)
          needle = '    pub fn definitions(&self, allowed_tools: Option<&BTreeSet<String>>) -> Vec<ToolDefinition> {'
          insert = '''    pub fn with_mcp_tools(mut self, tools: Vec<runtime::McpTool>, manager: runtime::McpServerManager) -> Self {\n        self.mcp_tools = tools;\n        self.mcp_manager = Some(Arc::new(Mutex::new(manager)));\n        self\n    }\n\n'''
          text = text.replace(needle, insert + needle, 1)
          normalize_old = '''            .chain(\n                self.plugin_tools\n                    .iter()\n                    .map(|tool| tool.definition().name.clone()),\n            )'''
          normalize_new = '''            .chain(self.plugin_tools.iter().map(|tool| tool.definition().name.clone()))\n            .chain(self.mcp_tools.iter().map(|tool| tool.name.clone()))'''
          if normalize_old not in text:
              raise SystemExit('normalize chain pattern missing')
          text = text.replace(normalize_old, normalize_new, 1)
          def_start = text.index('    pub fn definitions(')
          perm_start = text.index('    pub fn permission_specs(', def_start)
          exec_start = text.index('    pub fn execute(', perm_start)
          definitions = text[def_start:perm_start]
          definitions = definitions.replace('        let plugin = self\n', '        let mcp = self.mcp_tools.iter().filter(|tool| allowed_tools.is_none_or(|allowed| allowed.contains(&tool.name))).map(|tool| ToolDefinition {\n            name: tool.name.clone(),\n            description: tool.description.clone(),\n            input_schema: tool.input_schema.clone().unwrap_or_else(|| serde_json::json!({"type":"object"})),\n        });\n        let plugin = self\n', 1)
          definitions = definitions.replace('        builtin.chain(plugin).collect()', '        builtin.chain(mcp).chain(plugin).collect()', 1)
          permission = text[perm_start:exec_start]
          permission = permission.replace('        let plugin = self\n', '        let mcp = self.mcp_tools.iter().filter(|tool| allowed_tools.is_none_or(|allowed| allowed.contains(&tool.name))).map(|tool| (tool.name.clone(), PermissionMode::WorkspaceWrite));\n        let plugin = self\n', 1)
          permission = permission.replace('        builtin.chain(plugin).collect()', '        builtin.chain(mcp).chain(plugin).collect()', 1)
          text = text[:def_start] + definitions + permission + text[exec_start:]
          exec_old = '''        self.plugin_tools\n            .iter()\n            .find(|tool| tool.definition().name == name)\n            .ok_or_else(|| format!("unsupported tool: {name}"))?\n            .execute(input)\n            .map_err(|error| error.to_string())'''
          exec_new = '''        if let Some(manager) = &self.mcp_manager {\n            if self.mcp_tools.iter().any(|tool| tool.name == name) {\n                let mut guard = manager.lock().map_err(|_| "MCP manager lock poisoned".to_string())?;\n                let runtime = tokio::runtime::Runtime::new().map_err(|error| error.to_string())?;\n                let response = runtime.block_on(guard.call_tool(name, Some(input.clone()))).map_err(|error| error.to_string())?;\n                if let Some(error) = response.error {\n                    return Err(format!("{} ({})", error.message, error.code));\n                }\n                let result = response.result.ok_or_else(|| "MCP tool response missing result payload".to_string())?;\n                let output = runtime::McpToolOutput::from_result(result);\n                let rendered = output.render_for_model();\n                return if output.is_error { Err(rendered) } else { Ok(rendered) };\n            }\n        }\n        self.plugin_tools\n            .iter()\n            .find(|tool| tool.definition().name == name)\n            .ok_or_else(|| format!("unsupported tool: {name}"))?\n            .execute(input)\n            .map_err(|error| error.to_string())'''
          if exec_old not in text:
              raise SystemExit('execute fallback pattern missing')
          text = text.replace(exec_old, exec_new, 1)
          tools.write_text(text)

          main = root / 'rust/crates/claw-cli/src/main.rs'
          main_text = main.read_text()
          needle2 = '    let tool_registry = GlobalToolRegistry::with_plugin_tools(plugin_manager.aggregated_tools()?)?;\n    Ok((runtime_config.feature_config().clone(), tool_registry))'
          replace2 = '''    let mut tool_registry = GlobalToolRegistry::with_plugin_tools(plugin_manager.aggregated_tools()?)?;\n    if !runtime_config.mcp().servers().is_empty() {\n        let mut manager = runtime::McpServerManager::from_runtime_config(&runtime_config);\n        let mcp_tools = tokio::runtime::Runtime::new()?.block_on(manager.discover_tools())?;\n        let definitions = mcp_tools.into_iter().map(|managed| managed.tool).collect::<Vec<_>>();\n        tool_registry = tool_registry.with_mcp_tools(definitions, manager);\n    }\n    Ok((runtime_config.feature_config().clone(), tool_registry))'''
          if needle2 not in main_text:
              raise SystemExit('build_runtime_plugin_state pattern missing')
          main.write_text(main_text.replace(needle2, replace2, 1))
          PY
      - name: Verify
        run: cargo check --manifest-path rust/Cargo.toml -p tools -p claw-cli
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/tools/src/lib.rs rust/crates/claw-cli/src/main.rs
          git commit -m 'feat: wire discovered MCP tools into runtime registry'
          git push
