name: p9c-branch
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          assert 'enum CliOutputFormat {\n    Text,\n    Json,\n}' in s
          s = s.replace('enum CliOutputFormat {\n    Text,\n    Json,\n}', 'enum CliOutputFormat {\n    Text,\n    Json,\n    Ndjson,\n}', 1)
          s = s.replace('            "text" => Ok(Self::Text),\n            "json" => Ok(Self::Json),', '            "text" => Ok(Self::Text),\n            "json" => Ok(Self::Json),\n            "ndjson" => Ok(Self::Ndjson),', 1)
          old = '''                if output_format == CliOutputFormat::Json {
                    println!(
                        "{}",
                        json!({
                            "error": {
                                "message": error.to_string(),
                                "type": "runtime_error"
                            }
                        })
                    );'''
          new = '''                if matches!(output_format, CliOutputFormat::Json | CliOutputFormat::Ndjson) {
                    if output_format == CliOutputFormat::Ndjson {
                        println!("{}", json!({"type":"error","error":{"message":error.to_string(),"kind":"runtime_error"}}));
                    } else {
                        println!(
                            "{}",
                            json!({
                                "error": {
                                    "message": error.to_string(),
                                    "type": "runtime_error"
                                }
                            })
                        );
                    }'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''            CliOutputFormat::Text => self.run_turn(input),
            CliOutputFormat::Json => self.run_prompt_json(input),'''
          new = '''            CliOutputFormat::Text => self.run_turn(input),
            CliOutputFormat::Json => self.run_prompt_json(input),
            CliOutputFormat::Ndjson => self.run_prompt_ndjson(input),'''
          assert old in s
          s = s.replace(old, new, 1)
          anchor = '    fn run_prompt_json(&mut self, input: &str) -> Result<(), Box<dyn std::error::Error>> {'
          assert anchor in s
          method = r'''    fn run_prompt_ndjson(&mut self, input: &str) -> Result<(), Box<dyn std::error::Error>> {
        let session = self.runtime.session().clone();
        let mut runtime = build_runtime(
            session,
            self.model.clone(),
            self.system_prompt.clone(),
            true,
            false,
            self.allowed_tools.clone(),
            self.permission_mode,
            None,
        )?;
        let mut permission_prompter = CliPermissionPrompter::new(self.permission_mode);
        println!("{}", json!({"type":"message_start","model":self.model}));
        let summary = runtime.run_turn(input, Some(&mut permission_prompter))?;
        self.runtime = runtime;
        self.persist_session()?;
        println!("{}", json!({
            "type":"assistant",
            "message":final_assistant_text(&summary),
            "model":self.model,
            "iterations":summary.iterations,
            "tool_uses":collect_tool_uses(&summary),
            "tool_results":collect_tool_results(&summary)
        }));
        println!("{}", json!({
            "type":"result",
            "model":self.model,
            "usage":{
                "input_tokens":summary.usage.input_tokens,
                "output_tokens":summary.usage.output_tokens,
                "cache_creation_input_tokens":summary.usage.cache_creation_input_tokens,
                "cache_read_input_tokens":summary.usage.cache_read_input_tokens
            }
        }));
        Ok(())
    }

'''
          s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)
          PY
          cd rust
          cargo fmt --all -- --check
          cargo test -p claw-cli --lib
          cargo test -p commands --lib
          cargo check --workspace
          cd ..
          git add rust/crates/claw-cli/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: add NDJSON CLI output contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
