name: Phase 4A integration
on:
  push:
    branches:
      - phase-4a-json-error-contract
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4a-json-error-contract
          fetch-depth: 0
      - name: Patch JSON output error contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          old = '''        CliAction::Prompt {\n            prompt,\n            model,\n            output_format,\n            allowed_tools,\n            permission_mode,\n        } => LiveCli::new(model, true, allowed_tools, permission_mode)?\n            .run_turn_with_output(&prompt, output_format)?,'''
          new = '''        CliAction::Prompt {\n            prompt,\n            model,\n            output_format,\n            allowed_tools,\n            permission_mode,\n        } => {\n            let result = LiveCli::new(model, true, allowed_tools, permission_mode)\n                .and_then(|mut cli| cli.run_turn_with_output(&prompt, output_format));\n            if let Err(error) = result {\n                if output_format == CliOutputFormat::Json {\n                    println!(\"{}\", json!({\n                        \"error\": {\n                            \"message\": error.to_string(),\n                            \"type\": \"runtime_error\"\n                        }\n                    }));\n                    std::process::exit(1);\n                }\n                return Err(error);\n            }\n        },'''
          if old not in s:
              raise SystemExit('prompt dispatch block not found')
          s = s.replace(old, new, 1)
          old_test_anchor = '''    #[test]\n    fn output_format_json_is_supported() {'''
          if old_test_anchor in s:
              pass
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git rm .github/workflows/phase-4a-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/claw-cli/src/main.rs
          git commit -m 'feat: make JSON prompt errors machine-readable'
          git push origin phase-4a-json-error-contract
