name: Phase 10D one-shot repair

on:
  push:
    branches:
      - phase-10d-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final test fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          s = s.replace('assert_eq!(slash_command_specs().len(), 30);', 'assert_eq!(slash_command_specs().len(), 31);', 1)
          s = s.replace('assert_eq!(resume_supported_slash_commands().len(), 15);', 'assert_eq!(resume_supported_slash_commands().len(), 16);', 1)
          start = s.index('fn render_task_row(')
          end = s.index('\nfn render_task_snapshot(', start)
          new = '''fn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {
    let parent = snapshot.parent_id.as_deref().unwrap_or("-");
    let result = snapshot
        .result
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Result           {value}"));
    let error = snapshot
        .error
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Error            {value}"));
    format!(
        "  {:<24} {:<11} parent={parent}\\n    {}{result}{error}",
        snapshot.id,
        format_task_state(snapshot.state),
        snapshot.description,
    )
}'''
          s = s[:start] + new + s[end:]
          p.write_text(s)

          p = Path('rust/crates/claw-cli/src/main.rs')
          s = p.read_text()
          old = '"version", "export", "agents", "skills",'
          new = '"version", "export", "agents", "skills", "tasks",'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase-10d-one-shot.yml
          git add rust/crates/commands/src/lib.rs rust/crates/claw-cli/src/main.rs
          git commit -m "fix: finish Phase 10D test surface"
          git push origin HEAD:phase-10d-clean
