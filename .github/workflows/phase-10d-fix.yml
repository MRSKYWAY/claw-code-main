name: Phase 10D fix

on:
  push:
    branches: [phase-10d-task-inspection]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          old = '        SlashCommand::Skills { .. }\n        | SlashCommand::Mcp\n'
          new = '        SlashCommand::Skills { .. }\n        | SlashCommand::Tasks { .. }\n        | SlashCommand::Mcp\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('rust/crates/api/src/providers/gemini.rs')
          s = p.read_text()
          old = '        Some("STOP") | Some("FINISH_REASON_UNSPECIFIED") | None => {'
          new = '        Some("STOP" | "FINISH_REASON_UNSPECIFIED") | None => {'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/commands/src/lib.rs rust/crates/api/src/providers/gemini.rs
          git commit -m 'fix: handle tasks slash command and gemini clippy pattern'
          git push
          rm .github/workflows/phase-10d-fix.yml
          git add .github/workflows/phase-10d-fix.yml
          git commit -m 'chore: remove temporary phase 10D fix workflow'
          git push
