name: phase-9b-validate
on:
  push:
    branches:
      - phase-9b-reimplementation
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        run: python3 scripts/phase_9b_impl.py
      - name: Format and verify
        run: |
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git add rust/crates/commands/src/lib.rs rust/crates/commands/src/hooks.rs rust/crates/claw-cli/src/main.rs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: add safe hook management commands'
          git push
