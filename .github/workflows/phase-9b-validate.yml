          text = text.replace(parse_anchor, parse_replacement, 1)

          match_anchor = '        | SlashCommand::Agents { .. }\n        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'
          if match_anchor not in text:
              raise SystemExit('generic match anchor not found')
          text = text.replace(
              match_anchor,
