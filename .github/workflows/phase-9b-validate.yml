name: phase-9b-validate
on:
  push:
    branches:
      - phase-9b-reimplementation
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip validation commit rerun
        if: github.event.head_commit.message == 'feat: add safe hook management commands'
        run: echo 'Implementation commit already validated.'
      - name: Apply implementation
        if: github.event.head_commit.message != 'feat: add safe hook management commands'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/phase_9b_impl.py').read_text()
          source = source.split('\nPY\n', 1)[0]
          exec(compile(source, 'scripts/phase_9b_impl.py', 'exec'))
          PY
      - name: Format and verify
        if: github.event.head_commit.message != 'feat: add safe hook management commands'
        run: |
          cd rust
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Commit source changes
        if: github.event.head_commit.message != 'feat: add safe hook management commands'
        shell: bash
        run: |
          set -euo pipefail
          git add rust/crates/commands/src/lib.rs rust/crates/commands/src/hooks.rs rust/crates/claw-cli/src/main.rs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: add safe hook management commands'
          git push
