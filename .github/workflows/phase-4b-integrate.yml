name: Phase 4B integration

on:
  push:
    branches: [phase-4b-stdin-cli]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4b-stdin-cli
          fetch-depth: 0
      - name: Patch stdin prompt source
        shell: python
        run: |
          from pathlib import Path
          p = Path("rust/crates/claw-cli/src/main.rs")
          s = p.read_text()

          old = '''        let prompt = fs::read_to_string(&path)
            .map_err(|error| format!("could not read prompt file {}: {error}", path.display()))?;'''
          new = '''        let prompt = if path.as_os_str() == "-" {
            let mut prompt = String::new();
            io::stdin()
                .read_to_string(&mut prompt)
                .map_err(|error| format!("could not read prompt from stdin: {error}"))?;
            prompt
        } else {
            fs::read_to_string(&path)
                .map_err(|error| format!("could not read prompt file {}: {error}", path.display()))?
        };'''
          if old not in s:
              raise SystemExit("prompt-file read block not found")
          s = s.replace(old, new, 1)

          old_help = '''            "--prompt-file" => {'''
          new_help = '''            "--prompt-file" => {'''
          if old_help not in s:
              raise SystemExit("prompt-file parser marker not found")

          marker = '''fn join_optional_args(args: &[String]) -> Option<String> {'''
          tests = r'''
#[cfg(test)]
mod stdin_prompt_tests {
    use super::*;

    #[test]
    fn prompt_file_dash_is_accepted_as_stdin_source() {
        let action = parse_args(&[
            "--prompt-file".to_string(),
            "-".to_string(),
            "--output-format".to_string(),
            "json".to_string(),
        ])
        .expect("stdin prompt source should parse");

        match action {
            CliAction::Prompt { output_format, .. } => {
                assert_eq!(output_format, CliOutputFormat::Json);
            }
            other => panic!("expected prompt action, got {other:?}"),
        }
    }
}

'''
          if "mod stdin_prompt_tests" not in s:
              s = s.replace(marker, tests + marker, 1)

          p.write_text(s)
      - name: Verify formatting and tests
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo test -p claw-cli stdin_prompt_tests
      - name: Commit and remove workflow
        run: |
          git rm .github/workflows/phase-4b-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/claw-cli/src/main.rs
          git commit -m "feat: support stdin prompt input"
          git push origin phase-4b-stdin-cli
