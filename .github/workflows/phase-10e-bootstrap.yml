name: Phase 10E bootstrap

on:
  push:
    branches:
      - phase-10e-direct-agent-cancellation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-10e-direct-agent-cancellation
          fetch-depth: 0

      - name: Apply Phase 10E cancellation changes
        shell: python
        run: |
          from pathlib import Path

          # Runtime: expose cancellable turn execution while preserving existing callers.
          p = Path('rust/crates/runtime/src/conversation.rs')
          s = p.read_text()
          s = s.replace(
              'use crate::compact::{\n',
              'use crate::cancellation::CancellationToken;\nuse crate::compact::{\n',
              1,
          )
          old_trait = '''pub trait ApiClient {\n    fn stream(&mut self, request: ApiRequest) -> Result<Vec<AssistantEvent>, RuntimeError>;\n}'''
          new_trait = '''pub trait ApiClient {\n    fn stream(&mut self, request: ApiRequest) -> Result<Vec<AssistantEvent>, RuntimeError>;\n\n    fn stream_with_cancellation(\n        &mut self,\n        request: ApiRequest,\n        cancellation: &CancellationToken,\n    ) -> Result<Vec<AssistantEvent>, RuntimeError> {\n        if cancellation.is_cancelled() {\n            return Err(RuntimeError::new("conversation turn cancelled"));\n        }\n        self.stream(request)\n    }\n}'''
          if old_trait not in s:
              raise SystemExit('ApiClient trait anchor not found')
          s = s.replace(old_trait, new_trait, 1)
          old_run = '''    pub fn run_turn(\n        &mut self,\n        user_input: impl Into<String>,\n        mut prompter: Option<&mut dyn PermissionPrompter>,\n    ) -> Result<TurnSummary, RuntimeError> {'''
          new_run = '''    pub fn run_turn(\n        &mut self,\n        user_input: impl Into<String>,\n        prompter: Option<&mut dyn PermissionPrompter>,\n    ) -> Result<TurnSummary, RuntimeError> {\n        self.run_turn_with_cancellation(user_input, prompter, &CancellationToken::new())\n    }\n\n    pub fn run_turn_with_cancellation(\n        &mut self,\n        user_input: impl Into<String>,\n        mut prompter: Option<&mut dyn PermissionPrompter>,\n        cancellation: &CancellationToken,\n    ) -> Result<TurnSummary, RuntimeError> {'''
          if old_run not in s:
              raise SystemExit('run_turn anchor not found')
          s = s.replace(old_run, new_run, 1)
          s = s.replace(
              '        self.session\n            .messages\n            .push(ConversationMessage::user_text(user_input.into()));\n\n        let mut assistant_messages = Vec::new();',
              '        if cancellation.is_cancelled() {\n            return Err(RuntimeError::new("conversation turn cancelled"));\n        }\n\n        self.session\n            .messages\n            .push(ConversationMessage::user_text(user_input.into()));\n\n        let mut assistant_messages = Vec::new;',
              1,
          )
          s = s.replace(
              '            let request = ApiRequest {\n                system_prompt: self.system_prompt.clone(),\n                messages: self.session.messages.clone(),\n            };\n            let events = self.api_client.stream(request)?;',
              '            if cancellation.is_cancelled() {\n                return Err(RuntimeError::new("conversation turn cancelled"));\n            }\n\n            let request = ApiRequest {\n                system_prompt: self.system_prompt.clone(),\n                messages: self.session.messages.clone(),\n            };\n            let events = self.api_client.stream_with_cancellation(request, cancellation)?;',
              1,
          )
          s = s.replace(
              '            for (tool_use_id, tool_name, input) in pending_tool_uses {\n                let permission_outcome',
              '            for (tool_use_id, tool_name, input) in pending_tool_uses {\n                if cancellation.is_cancelled() {\n                    return Err(RuntimeError::new("conversation turn cancelled"));\n                }\n                let permission_outcome',
              1,
          )
          p.write_text(s)

          # Runtime registry: let external dispatchers clone the task-owned cancellation token.
          p = Path('rust/crates/runtime/src/subagent.rs')
          s = p.read_text()
          anchor = '''    pub fn snapshot(&self, id: &str) -> Result<Option<SubagentSnapshot>, SubagentError> {'''
          insertion = '''    pub fn cancellation_token(&self, id: &str) -> Result<CancellationToken, SubagentError> {\n        let records = self\n            .inner\n            .lock()\n            .map_err(|_| SubagentError::RegistryPoisoned)?;\n        records\n            .get(id)\n            .map(|record| record.cancellation.clone())\n            .ok_or_else(|| SubagentError::UnknownId(id.to_string()))\n    }\n\n'''
          if anchor not in s:
              raise SystemExit('snapshot anchor not found')
          s = s.replace(anchor, insertion + anchor, 1)
          p.write_text(s)

          # Tools: pass the registry token into the Agent turn and make the provider await cancellable.
          p = Path('rust/crates/tools/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              '    RuntimeError, Session, TokenUsage, ToolError, ToolExecutor,\n',
              '    CancellationToken, RuntimeError, Session, TokenUsage, ToolError, ToolExecutor,\n',
              1,
          )
          old_job = '''    let result: Result<String, String> = (|| {\n        let mut runtime = build_agent_runtime(job)?\n            .with_max_iterations(max_iterations_for_subagent(subagent_type));\n        let summary = runtime\n            .run_turn(job.prompt.clone(), None)\n            .map_err(|error| error.to_string())?;\n        Ok(final_assistant_text(&summary))\n    })();\n\n    match result {\n        Ok(final_text) => {'''
          new_job = '''    let cancellation = runtime::global_subagent_registry()\n        .cancellation_token(&job.manifest.agent_id)\n        .map_err(|error| error.to_string())?;\n    let result: Result<String, String> = (|| {\n        let mut runtime = build_agent_runtime(job)?\n            .with_max_iterations(max_iterations_for_subagent(subagent_type));\n        let summary = runtime\n            .run_turn_with_cancellation(job.prompt.clone(), None, &cancellation)\n            .map_err(|error| error.to_string())?;\n        Ok(final_assistant_text(&summary))\n    })();\n\n    match result {\n        Ok(final_text) if cancellation.is_cancelled() => {\n            persist_agent_terminal_state(\n                &job.manifest,\n                &mut job.lifecycle,\n                AgentStatus::Cancelled,\n                None,\n                None,\n            )\n        }\n        Ok(final_text) => {'''
          if old_job not in s:
              raise SystemExit('run_agent_job anchor not found')
          s = s.replace(old_job, new_job, 1)
          old_header = '''impl ApiClient for ProviderRuntimeClient {\n    fn stream(&mut self, request: ApiRequest) -> Result<Vec<AssistantEvent>, RuntimeError> {'''
          new_header = '''impl ProviderRuntimeClient {\n    fn stream_internal(\n        &mut self,\n        request: ApiRequest,\n        cancellation: Option<CancellationToken>,\n    ) -> Result<Vec<AssistantEvent>, RuntimeError> {'''
          if old_header not in s:
              raise SystemExit('ProviderRuntimeClient impl anchor not found')
          s = s.replace(old_header, new_header, 1)
          old_start = '''            let mut stream = self\n                .client\n                .stream_message(&message_request)\n                .await\n                .map_err(|error| RuntimeError::new(error.to_string()))?;'''
          new_start = '''            let stream_result = match cancellation.clone() {\n                Some(token) => tokio::select! {\n                    _ = wait_for_cancellation(token) => {\n                        return Err(RuntimeError::new("conversation turn cancelled"));\n                    }\n                    result = self.client.stream_message(&message_request) => result,\n                },\n                None => self.client.stream_message(&message_request).await,\n            };\n            let mut stream = stream_result\n                .map_err(|error| RuntimeError::new(error.to_string()))?;'''
          if old_start not in s:
              raise SystemExit('provider stream start anchor not found')
          s = s.replace(old_start, new_start, 1)
          old_next = '''            while let Some(event) = stream\n                .next_event()\n                .await\n                .map_err(|error| RuntimeError::new(error.to_string()))?\n            {'''
          new_next = '''            while let Some(event) = {\n                let next_result = match cancellation.clone() {\n                    Some(token) => tokio::select! {\n                        _ = wait_for_cancellation(token) => {\n                            return Err(RuntimeError::new("conversation turn cancelled"));\n                        }\n                        result = stream.next_event() => result,\n                    },\n                    None => stream.next_event().await,\n                };\n                next_result.map_err(|error| RuntimeError::new(error.to_string()))?\n            } {'''
          if old_next not in s:
              raise SystemExit('provider stream event anchor not found')
          s = s.replace(old_next, new_next, 1)
          old_fallback = '''            let response = self\n                .client\n                .send_message(&MessageRequest {\n                    stream: false,\n                    ..message_request.clone()\n                })\n                .await\n                .map_err(|error| RuntimeError::new(error.to_string()))?;'''
          new_fallback = '''            let response_result = match cancellation.clone() {\n                Some(token) => tokio::select! {\n                    _ = wait_for_cancellation(token) => {\n                        return Err(RuntimeError::new("conversation turn cancelled"));\n                    }\n                    result = self.client.send_message(&MessageRequest {\n                        stream: false,\n                        ..message_request.clone()\n                    }) => result,\n                },\n                None => self\n                    .client\n                    .send_message(&MessageRequest {\n                        stream: false,\n                        ..message_request.clone()\n                    })\n                    .await,\n            };\n            let response = response_result\n                .map_err(|error| RuntimeError::new(error.to_string()))?;'''
          if old_fallback not in s:
              raise SystemExit('provider fallback anchor not found')
          s = s.replace(old_fallback, new_fallback, 1)
          marker = '\nstruct SubagentToolExecutor {'
          trait_impl = '''\nimpl ApiClient for ProviderRuntimeClient {\n    fn stream(&mut self, request: ApiRequest) -> Result<Vec<AssistantEvent>, RuntimeError> {\n        self.stream_internal(request, None)\n    }\n\n    fn stream_with_cancellation(\n        &mut self,\n        request: ApiRequest,\n        cancellation: &CancellationToken,\n    ) -> Result<Vec<AssistantEvent>, RuntimeError> {\n        self.stream_internal(request, Some(cancellation.clone()))\n    }\n}\n\nasync fn wait_for_cancellation(token: CancellationToken) {\n    while !token.is_cancelled() {\n        tokio::time::sleep(Duration::from_millis(25)).await;\n    }\n}\n'''
          if marker not in s:
              raise SystemExit('tool executor marker not found')
          s = s.replace(marker, trait_impl + marker, 1)
          p.write_text(s)

          # Remove bootstrap workflow after it has performed the patch.
          wp = Path('.github/workflows/phase-10e-bootstrap.yml')
          if wp.exists():
              wp.unlink()

          # Keep the next target explicit in the parity roadmap while this branch is under review.
          p = Path('PARITY.md')
          s = p.read_text()
          target = '1. **Phase 10D — task inspection:** expose registry-backed `/tasks`/agent-status plumbing and session-safe task lookup before adding richer planning/review UX.\n2. Wire registry cancellation back into external Agent execution so provider work can terminate cooperatively.'
          replacement = '1. **Phase 10D — task inspection:** expose registry-backed `/tasks`/agent-status plumbing and session-safe task lookup before adding richer planning/review UX.\n2. **Phase 10E — direct Agent cancellation:** wire registry cancellation back into external Agent execution so provider work can terminate cooperatively.\n3. Expand persistent background-task/session history and session-safe lookup.\n4. Expand structured/remote assistant transport semantics only after the subagent/task model is represented consistently across local execution modes.\n5. Return to richer MCP lifecycle and the broader TypeScript service/tool ecosystem after the subagent architecture is wired through the live dispatcher.'
          if target in s:
              s = s.replace(target, replacement, 1)
          p.write_text(s)

      - name: Format and verify
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo test -p runtime --lib
          cargo test -p commands --lib
          cargo test -p claw-cli --bin claw

      - name: Commit Phase 10E changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/runtime/src/conversation.rs rust/crates/runtime/src/subagent.rs rust/crates/tools/src/lib.rs PARITY.md .github/workflows
          git commit -m "feat: make external Agent execution cancellable"
          git push origin HEAD:phase-10e-direct-agent-cancellation
