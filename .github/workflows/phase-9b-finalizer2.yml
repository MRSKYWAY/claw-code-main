name: phase-9b-finalizer2
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic source fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          commands = Path('rust/crates/commands/src/lib.rs')
          lines = commands.read_text().splitlines()

          # Remove the stale duplicate /hooks parser arm.
          in_parse = False
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() == 'pub fn parse(input: &str) -> Option<Self> {' or line.strip() == 'pub fn parse(input: &str) -> Option<Self>':
                  in_parse = True
              if in_parse and line.strip() == '"hooks" => Self::Config {':
                  if i + 2 < len(lines) and lines[i + 1].strip() == 'section: Some("hooks".to_string()),' and lines[i + 2].strip() == '},':
                      i += 3
                      continue
              out.append(line)
              if in_parse and line.strip() == '}' and i > 0 and lines[i-1].strip().startswith('other =>'):
                  in_parse = False
              i += 1
          lines = out

          # Fix hook config mutation borrow: validate immutably, then borrow mutably.
          start = None
          for idx, line in enumerate(lines):
              if 'let hooks = root.get_mut("hooks").and_then(serde_json::Value::as_object_mut);' in line:
                  start = idx
                  break
          if start is None:
              raise SystemExit('hook mutable-borrow block not found')
          end = None
          for idx in range(start, min(start + 12, len(lines))):
              if 'expect("hooks object")' in lines[idx]:
                  end = idx
                  break
          if end is None:
              raise SystemExit('hook borrow block terminator not found')
          replacement = [
              '            if let Some(value) = root.get("hooks") {',
              '                if !value.is_object() {',
              '                    return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));',
              '                }',
              '            } else {',
              '                root["hooks"] = serde_json::json!({});',
              '            }',
              '            let hooks = root',
              '                .get_mut("hooks")',
              '                .and_then(serde_json::Value::as_object_mut)',
              '                .expect("hooks object");',
          ]
          lines[start:end + 1] = replacement

          # Cover Hooks in the generic slash dispatcher.
          text = '\n'.join(lines) + '\n'
          marker = 'pub fn handle_slash_command('
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('handle_slash_command not found')
          tail = text[pos:]
          if '| SlashCommand::Hooks { .. }' not in tail[:tail.find('fn normalize_hook_event') if 'fn normalize_hook_event' in tail else len(tail)]:
              target = '        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'
              if target not in tail:
                  raise SystemExit('commands dispatcher target not found')
              tail = tail.replace(target, '        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,', 1)
              text = text[:pos] + tail

          commands.write_text(text)

          cli = Path('rust/crates/claw-cli/src/main.rs')
          text = cli.read_text()
          marker = 'fn run_resume_command('
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('run_resume_command not found')
          tail = text[pos:]
          target = '        | SlashCommand::Plugins { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),'
          if '| SlashCommand::Hooks { .. }' not in tail[:tail.find('\n}\n', 0) if '\n}\n' in tail else len(tail)]:
              if target not in tail:
                  raise SystemExit('claw-cli resume dispatcher target not found')
              tail = tail.replace(target, '        | SlashCommand::Plugins { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),', 1)
              text = text[:pos] + tail
          cli.write_text(text)
          PY

          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Clean temporary repair files and commit
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml .github/workflows/phase-9b-lastfix.yml .github/workflows/phase-9b-repair-final.yml .github/workflows/phase-9b-finalizer.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt .github/phase-9b-final-trigger.txt .github/phase-9b-repair-final-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hook management"
          git push
