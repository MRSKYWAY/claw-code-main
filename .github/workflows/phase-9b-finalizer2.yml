name: phase-9b-finalizer2
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact current source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          commands = Path('rust/crates/commands/src/lib.rs')
          text = commands.read_text()

          duplicate = re.compile(r'\n\s*"hooks"\s*=>\s*Self::Config\s*\{\s*section:\s*Some\("hooks"\.to_string\(\)\),\s*\},')
          text, n = duplicate.subn('', text, count=1)
          if n != 1:
              raise SystemExit(f'duplicate parser arm not found exactly once: {n}')

          borrow = re.compile(r'let hooks = root\.get_mut\("hooks"\).*?expect\("hooks object"\);', re.S)
          replacement = '''if let Some(value) = root.get("hooks") {\n                if !value.is_object() {\n                    return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));\n                }\n            } else {\n                root["hooks"] = serde_json::json!({});\n            }\n            let hooks = root\n                .get_mut("hooks")\n                .and_then(serde_json::Value::as_object_mut)\n                .expect("hooks object");'''
          text, n = borrow.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'hook borrow block not found exactly once: {n}')
          commands.write_text(text)

          cli = Path('rust/crates/claw-cli/src/main.rs')
          text = cli.read_text()
          target = re.compile(r'(\| SlashCommand::Plugins \{ \.\. \}\n)(\s*\| SlashCommand::Unknown\(_\) => Err\("unsupported resumed slash command"\.into\(\)\),)')
          text, n = target.subn(r'\1        | SlashCommand::Hooks { .. }\n\2', text, count=1)
          if n != 1:
              raise SystemExit(f'claw-cli resumed dispatcher arm not found exactly once: {n}')
          cli.write_text(text)
          PY

          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Commit only the validated source changes
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hook management"
          git push
