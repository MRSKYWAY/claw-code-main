name: phase-9b-finalizer2
on:
  push:
    branches: [phase-9b-hook-management]
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic source fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          commands = Path('rust/crates/commands/src/lib.rs')
          lines = commands.read_text().splitlines()

          in_parse = False
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() in ('pub fn parse(input: &str) -> Option<Self> {', 'pub fn parse(input: &str) -> Option<Self>'):
                  in_parse = True
              if in_parse and line.strip() == '"hooks" => Self::Config {':
                  if i + 2 < len(lines) and lines[i + 1].strip().startswith('section: Some("hooks"') and lines[i + 2].strip() == '},':
                      i += 3
                      continue
              out.append(line)
              if in_parse and line.strip() == '}' and i > 0 and lines[i-1].strip().startswith('other =>'):
                  in_parse = False
              i += 1
          lines = out

          start = next((i for i, line in enumerate(lines) if 'let hooks = root.get_mut("hooks").and_then(serde_json::Value::as_object_mut);' in line), None)
          if start is not None:
              end = next((i for i in range(start, min(start + 12, len(lines))) if 'expect("hooks object")' in lines[i]), None)
              if end is None:
                  raise SystemExit('hooks borrow block terminator not found')
              lines[start:end + 1] = [
                  '            if let Some(value) = root.get("hooks") {',
                  '                if !value.is_object() {',
                  '                    return Err(io::Error::other(format!("{}: hooks must be an object", path.display())));',
                  '                }',
                  '            } else {',
                  '                root["hooks"] = serde_json::json!({});',
                  '            }',
                  '            let hooks = root',
                  '                .get_mut("hooks")',
                  '                .and_then(serde_json::Value::as_object_mut)',
                  '                .expect("hooks object");',
              ]

          text = '\n'.join(lines) + '\n'
          parse_pos = text.find('SlashCommand::parse("/hooks")')
          if parse_pos < 0:
              raise SystemExit('hooks parser assertion not found')
          parse_end = text.find('        );', parse_pos)
          if parse_end < 0:
              raise SystemExit('hooks parser assertion end not found')
          parse_block = text[parse_pos:parse_end + len('        );')]
          if 'SlashCommand::Config' in parse_block:
              replacement = '''SlashCommand::parse("/hooks"),
            Some(SlashCommand::Hooks {
                action: None,
                event: None,
                command: None,
            })
        );'''
              text = text[:parse_pos] + replacement + text[parse_end + len('        );'):]

          marker = 'pub fn handle_slash_command('
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('handle_slash_command not found')
          tail = text[pos:]
          body_end = tail.find('\n}\n\n#[cfg(test)]')
          section = tail[:body_end] if body_end >= 0 else tail
          if '| SlashCommand::Hooks { .. }' not in section:
              target = '        | SlashCommand::Skills { .. }\n        | SlashCommand::Unknown(_) => None,'
              if target not in section:
                  raise SystemExit('commands dispatcher target not found')
              section = section.replace(target, '        | SlashCommand::Skills { .. }\n        | SlashCommand::Hooks { .. }\n        | SlashCommand::Unknown(_) => None,', 1)
              tail = section + tail[len(section):]
              text = text[:pos] + tail

          commands.write_text(text)

          cli = Path('rust/crates/claw-cli/src/main.rs')
          lines = cli.read_text().splitlines()
          start = next((i for i, line in enumerate(lines) if line.strip() == 'fn run_resume_command('), None)
          if start is None:
              raise SystemExit('run_resume_command not found')
          depth = 0
          unknown = None
          for i in range(start, len(lines)):
              depth += lines[i].count('{') - lines[i].count('}')
              if 'SlashCommand::Unknown(_) => Err("unsupported resumed slash command".into()),' in lines[i] and depth > 0:
                  unknown = i
                  break
          if unknown is None:
              raise SystemExit('resume Unknown arm not found')
          if not any('SlashCommand::Hooks { .. }' in line for line in lines[start:unknown + 1]):
              lines.insert(unknown, '        | SlashCommand::Hooks { .. }')
          cli.write_text('\n'.join(lines) + '\n')
          PY
          cd rust
          cargo fmt --all
          cargo check -p commands
          cargo test -p commands --lib
          cargo check -p claw-cli
      - name: Clean repair scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase-9b-fix.yml .github/workflows/phase-9b-fix2.yml .github/workflows/phase-9b-repair.yml .github/workflows/phase-9b-repair2.yml .github/workflows/phase-9b-repair3.yml .github/workflows/phase-9b-repair4.yml .github/workflows/phase-9b-repair5.yml .github/workflows/phase-9b-repair6.yml .github/workflows/phase-9b-repair7.yml .github/workflows/phase-9b-repair8.yml .github/workflows/phase-9b-finalize.yml .github/workflows/phase-9b-finalizer2.yml .github/workflows/phase-9b-final-testfix.yml .github/workflows/phase-9b-lastfix.yml .github/workflows/phase-9b-repair-final.yml
          rm -f .github/phase-9b-fix-trigger.txt .github/phase-9b-fix2-trigger.txt .github/phase-9b-trigger.txt .github/phase-9b-final-trigger.txt .github/phase-9b-repair-final-trigger.txt .github/phase-9b-repair8-trigger.txt .github/phase-9b-final-test-trigger.txt .github/phase-9b-deterministic-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize phase 9b hook management"
          git push
