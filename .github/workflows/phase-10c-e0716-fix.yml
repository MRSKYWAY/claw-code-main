name: Phase 10C E0716 fix
on:
  push:
    branches:
      - phase-10c-e0716-fix
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/tools/src/agent_lifecycle.rs')
          text = path.read_text()
          old = '''fn current_agent_parent_id(agent_id: &str) -> Option<String> {\n    let name = std::thread::current().name()?;\n    let parent_id = name\n'''
          new = '''fn current_agent_parent_id(agent_id: &str) -> Option<String> {\n    let current = std::thread::current();\n    let name = current.name()?;\n    let parent_id = name\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/tools/src/agent_lifecycle.rs
          git commit -m "fix: extend thread handle lifetime for agent parent lookup"
          rm .github/workflows/phase-10c-e0716-fix.yml
          git add .github/workflows/phase-10c-e0716-fix.yml
          git commit --amend --no-edit
          git push
