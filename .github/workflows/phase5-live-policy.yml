name: Phase 5 Live Policy Verification

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Wire live policy enforcement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/runtime/src/conversation.rs')
          s = p.read_text()
          s = s.replace(
              'use crate::permissions::{PermissionOutcome, PermissionPolicy, PermissionPrompter};',
              'use crate::permissions::{PermissionOutcome, PermissionPolicy, PermissionPrompter, ToolPolicyDecision};',
          )

          old = '''                let result_message = match permission_outcome {
                    PermissionOutcome::Allow => {
                        let pre_hook_result = self.hook_runner.run_pre_tool_use(&tool_name, &input);
                        if pre_hook_result.is_denied() {
                            let deny_message = format!("PreToolUse hook denied tool `{tool_name}`");
                            ConversationMessage::tool_result(
                                tool_use_id,
                                tool_name,
                                format_hook_message(&pre_hook_result, &deny_message),
                                true,
                            )
                        } else {
                            let (mut output, mut is_error) =
                                match self.tool_executor.execute(&tool_name, &input) {
                                    Ok(output) => (output, false),
                                    Err(error) => (error.to_string(), true),
                                };
                            output = merge_hook_feedback(pre_hook_result.messages(), output, false);

                            let post_hook_result = self
                                .hook_runner
                                .run_post_tool_use(&tool_name, &input, &output, is_error);
                            if post_hook_result.is_denied() {
                                is_error = true;
                            }
                            output = merge_hook_feedback(
                                post_hook_result.messages(),
                                output,
                                post_hook_result.is_denied(),
                            );

                            ConversationMessage::tool_result(
                                tool_use_id,
                                tool_name,
                                output,
                                is_error,
                            )
                        }
                    }
                    PermissionOutcome::Deny { reason } => {
                        ConversationMessage::tool_result(tool_use_id, tool_name, reason, true)
                    }
                };'''

          new = '''                let pre_hook_result = if matches!(permission_outcome, PermissionOutcome::Allow) {
                    self.hook_runner.run_pre_tool_use(&tool_name, &input)
                } else {
                    HookRunResult::allow(Vec::new())
                };
                let policy_decision = ToolPolicyDecision::from_permission_and_hook(
                    &permission_outcome,
                    &pre_hook_result,
                );

                let result_message = match policy_decision {
                    ToolPolicyDecision::Allow => {
                        let (mut output, mut is_error) =
                            match self.tool_executor.execute(&tool_name, &input) {
                                Ok(output) => (output, false),
                                Err(error) => (error.to_string(), true),
                            };
                        output = merge_hook_feedback(pre_hook_result.messages(), output, false);

                        let post_hook_result = self
                            .hook_runner
                            .run_post_tool_use(&tool_name, &input, &output, is_error);
                        if post_hook_result.is_denied() {
                            is_error = true;
                        }
                        output = merge_hook_feedback(
                            post_hook_result.messages(),
                            output,
                            post_hook_result.is_denied(),
                        );

                        ConversationMessage::tool_result(
                            tool_use_id,
                            tool_name,
                            output,
                            is_error,
                        )
                    }
                    ToolPolicyDecision::PermissionDenied { reason } => {
                        ConversationMessage::tool_result(tool_use_id, tool_name, reason, true)
                    }
                    ToolPolicyDecision::HookDenied { messages } => {
                        let deny_message = format!("PreToolUse hook denied tool `{tool_name}`");
                        let output = if messages.is_empty() {
                            deny_message
                        } else {
                            messages.join("\\n")
                        };
                        ConversationMessage::tool_result(tool_use_id, tool_name, output, true)
                    }
                };'''

          if old not in s:
              raise SystemExit('target execution block not found')
          s = s.replace(old, new, 1)

          marker = '''    #[test]
    fn denies_tool_use_when_pre_tool_hook_blocks() {'''
          test = '''    #[test]
    fn permission_denial_short_circuits_pre_tool_hook() {
        struct SingleCallApi;
        impl ApiClient for SingleCallApi {
            fn stream(&mut self, _request: ApiRequest) -> Result<Vec<AssistantEvent>, RuntimeError> {
                Ok(vec![
                    AssistantEvent::ToolUse {
                        id: "tool-1".to_string(),
                        name: "blocked".to_string(),
                        input: "secret".to_string(),
                    },
                    AssistantEvent::MessageStop,
                ])
            }
        }

        let mut runtime = ConversationRuntime::new_with_features(
            Session::new(),
            SingleCallApi,
            StaticToolExecutor::new().register("blocked", |_input| {
                panic!("tool must not execute after permission denial")
            }),
            PermissionPolicy::new(PermissionMode::ReadOnly)
                .with_tool_requirement("blocked", PermissionMode::WorkspaceWrite),
            vec!["system".to_string()],
            &RuntimeFeatureConfig::default().with_hooks(RuntimeHookConfig::new(
                vec![shell_snippet("printf 'hook denial'; exit 2")],
                Vec::new(),
            )),
        );

        let summary = runtime
            .run_turn("use the tool", None)
            .expect("permission denial should remain a tool result");
        let result = &summary.tool_results[0];
        assert!(result.is_error);
        let output = result
            .blocks
            .iter()
            .find_map(|block| match block {
                ContentBlock::ToolResult { content, .. } => Some(content.as_str()),
                _ => None,
            })
            .expect("tool result content should be present");
        assert!(output.contains("requires workspace-write permission"));
        assert!(!output.contains("hook denial"));
        assert_eq!(runtime.session().messages.len(), 3);
    }

'''
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY

      - name: Run runtime tests
        run: cargo test --manifest-path rust/Cargo.toml -p runtime --lib

      - name: Check CLI
        run: cargo check --manifest-path rust/Cargo.toml -p claw-cli

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/runtime/src/conversation.rs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: enforce combined tool policy decisions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
