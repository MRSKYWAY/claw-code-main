name: Phase 10D test fix 4

on:
  push:
    branches: [phase-10d-task-inspection-repair]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-10d-task-inspection-repair
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/commands/src/lib.rs')
          s = p.read_text()
          old = 'assert_eq!(slash_command_specs().len(), 30);'
          if old in s:
              s = s.replace(old, 'assert_eq!(slash_command_specs().len(), 31);', 1)
          start = s.index('fn render_task_row(')
          end = s.index('\nfn render_task_snapshot(', start)
          new = '''fn render_task_row(snapshot: &runtime::SubagentSnapshot) -> String {
    let parent = snapshot.parent_id.as_deref().unwrap_or("-");
    let result = snapshot
        .result
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Result           {value}"));
    let error = snapshot
        .error
        .as_deref()
        .map_or(String::new(), |value| format!("\\n    Error            {value}"));
    format!(
        "  {:<24} {:<11} parent={parent}\\n    {}{result}{error}",
        snapshot.id,
        format_task_state(snapshot.state),
        snapshot.description,
    )
}'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
          cd rust && cargo test -p commands tasks_command_parses_and_renders_registry_state --lib
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/phase-10d-apply-fix.yml .github/workflows/phase-10d-fix5.yml .github/workflows/phase-10d-fix6.yml .github/workflows/phase-10d-repair.yml .github/workflows/phase-10d-test-fix.yml .github/workflows/phase-10d-test-fix4.yml phase-10d-trigger.txt
          git add rust/crates/commands/src/lib.rs .github/workflows phase-10d-trigger.txt
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: complete phase 10d task inspection'
          git push origin HEAD:phase-10d-task-inspection-repair
